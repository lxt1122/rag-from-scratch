<script>
const DATA = {"root": {"id": "root", "zh": "RAG From Scratch", "en": "RAG From Scratch", "sum": "Lance Martin's 2.5-hour course: build basic RAG, then improve each pipeline stage from query translation to self-correcting generation.", "kind": "concept", "c": "--c-overview", "t": 0, "children": [{"id": "n1", "zh": "课程概览", "en": "Overview", "sum": "Why RAG exists, its three basic stages, and a roadmap of the advanced techniques the course covers.", "kind": "concept", "c": "--c-overview", "t": 0, "nb": "rag_from_scratch_1_to_4.ipynb", "children": [{"id": "n2", "zh": "动机：私有数据", "en": "Motivation: private data", "sum": "Most of the world's data is private, but LLMs are trained only on publicly available data.", "kind": "concept", "c": "--c-overview", "t": 34, "children": [{"id": "n3", "zh": "预训练 token 规模", "en": "Pretraining token scale", "sum": "Training sets range from about 1.5 trillion tokens for small models like Phi-2 to undisclosed sizes for GPT-4 and Claude 3.", "kind": "concept", "c": "--c-overview", "t": 45}, {"id": "n4", "zh": "上下文窗口扩大", "en": "Context windows keep growing", "sum": "Windows grew from 4–8K tokens (about a dozen pages) a year earlier to around a million tokens (thousands of pages).", "kind": "concept", "c": "--c-overview", "t": 63, "note": "窗口越来越大，因此把大量外部私有数据直接喂给 LLM 变得越来越可行。"}, {"id": "n5", "zh": "LLM 是新型操作系统", "en": "LLM as new operating system", "sum": "He sees LLMs as the center of a new kind of operating system, which makes feeding them external data critical.", "kind": "opinion", "c": "--c-overview", "t": 112}]}, {"id": "n6", "zh": "RAG 三个基本阶段", "en": "Three basic RAG stages", "sum": "RAG breaks down into indexing external data, retrieving documents relevant to a question, and generating a grounded answer.", "kind": "concept", "c": "--c-overview", "t": 133, "children": [{"id": "n7", "zh": "索引", "en": "Indexing", "sum": "Build a searchable store of documents, which could be a SQL/relational database or a vector store.", "kind": "step", "c": "--c-overview", "t": 137}, {"id": "n8", "zh": "检索", "en": "Retrieval", "sum": "Fetch documents using some heuristic that measures how relevant they are to an input question.", "kind": "step", "c": "--c-overview", "t": 160}, {"id": "n9", "zh": "生成", "en": "Generation", "sum": "Pass the relevant documents to an LLM, which writes an answer grounded in that retrieved information.", "kind": "step", "c": "--c-overview", "t": 165}, {"id": "n10", "zh": "RAG 为何强大", "en": "Why RAG is powerful", "sum": "It combines what LLMs know and can process with large private data sources, which is where most important data lives.", "kind": "opinion", "c": "--c-overview", "t": 178}]}, {"id": "n11", "zh": "课程路线图", "en": "Course roadmap", "sum": "The advanced sections follow the path from user question to answer, one stage at a time.", "kind": "concept", "c": "--c-overview", "t": 208, "children": [{"id": "n12", "zh": "Query 翻译", "en": "Query translation", "sum": "Change the user's question so it suits retrieval better, e.g. by rewriting it or splitting it into sub-questions.", "kind": "concept", "c": "--c-overview", "t": 215}, {"id": "n13", "zh": "路由", "en": "Routing", "sum": "Send the question to the right source when several exist, such as multiple vector stores, a relational DB or a graph DB.", "kind": "concept", "c": "--c-overview", "t": 237}, {"id": "n14", "zh": "Query 构造", "en": "Query construction", "sum": "Turn natural language into the DSL that a given data source needs.", "kind": "concept", "c": "--c-overview", "t": 252, "children": [{"id": "n15", "zh": "Text-to-SQL", "en": "Text-to-SQL", "sum": "Translate questions into SQL for relational databases; he calls this a well-studied problem.", "kind": "concept", "c": "--c-overview", "t": 263}, {"id": "n16", "zh": "Text-to-Cypher", "en": "Text-to-Cypher", "sum": "Translate questions into Cypher queries for graph databases.", "kind": "concept", "c": "--c-overview", "t": 265}, {"id": "n17", "zh": "Text-to-元数据过滤", "en": "Text-to-metadata filters", "sum": "Turn questions into metadata filters for vector databases, which he calls a big area of study.", "kind": "concept", "c": "--c-overview", "t": 271}]}, {"id": "n18", "zh": "索引技术", "en": "Indexing techniques", "sum": "Process documents so they are easy to retrieve, using different embedding methods and indexing strategies.", "kind": "concept", "c": "--c-overview", "t": 278}, {"id": "n19", "zh": "检索后重排/过滤", "en": "Post-retrieval rerank/filter", "sum": "After retrieval, rerank or filter the documents that came back.", "kind": "concept", "c": "--c-overview", "t": 293}, {"id": "n20", "zh": "Active RAG 反馈", "en": "Active RAG with feedback", "sum": "Grade documents and answers, and when a check fails, retrieve again, rewrite the question or regenerate the answer.", "kind": "concept", "c": "--c-overview", "t": 300, "children": [{"id": "n21", "zh": "评估相关性", "en": "Grade relevance", "sum": "Check that the retrieved documents or the answer are actually relevant to the question.", "kind": "step", "c": "--c-overview", "t": 312}, {"id": "n22", "zh": "评估忠实度", "en": "Grade faithfulness", "sum": "Check that the answer stays faithful to the documents, which means checking for hallucinations.", "kind": "step", "c": "--c-overview", "t": 315}, {"id": "n23", "zh": "失败时反馈循环", "en": "Feedback loop on failure", "sum": "When grading fails, re-retrieve, rewrite the question, or regenerate the answer.", "kind": "step", "c": "--c-overview", "t": 319}]}, {"id": "n24", "zh": "先基础后进阶", "en": "Basics first, then advanced", "sum": "The course does bare-bones indexing, retrieval and generation first, then moves to query transformations, routing and construction.", "kind": "step", "c": "--c-overview", "t": 339}]}], "chapter": true}, {"id": "s73", "zh": "基础管道", "en": "Basic RAG", "sum": "The minimal pipeline: index documents as vectors, retrieve the nearest chunks, and generate an answer grounded in them.", "kind": "concept", "c": "--c-basics", "t": 353, "children": [{"id": "n25", "zh": "索引", "en": "Indexing", "sum": "How documents are loaded, split, turned into vectors and stored so a retriever can find the ones relevant to a question.", "kind": "concept", "c": "--c-basics", "t": 353, "nb": "rag_from_scratch_1_to_4.ipynb", "children": [{"id": "n26", "zh": "Retriever 目标", "en": "Retriever goal", "sum": "Load external documents into a retriever that, given a question, returns the documents related to it.", "kind": "concept", "c": "--c-basics", "t": 376}, {"id": "n27", "zh": "为何用数值表示", "en": "Why numerical representations", "sum": "Comparing vectors of numbers is much easier than comparing free-form text, so documents are compressed into numbers.", "kind": "concept", "c": "--c-basics", "t": 395, "children": [{"id": "n28", "zh": "稀疏向量", "en": "Sparse vectors", "sum": "Statistical methods (from Google and others) count word frequencies over a huge vocabulary, so most entries are zero.", "kind": "concept", "c": "--c-basics", "t": 426, "note": "向量的每个位置对应词表中的一个词，值为该词出现的次数；这类表示已有很成熟的搜索方法。"}, {"id": "n29", "zh": "机器学习 Embedding", "en": "Learned embeddings", "sum": "Newer machine-learned models compress a document into a fixed-length vector, and strong search methods exist for these vectors.", "kind": "concept", "c": "--c-basics", "t": 460}]}, {"id": "n30", "zh": "Embedding 索引流程", "en": "Embedding index pipeline", "sum": "Split documents, embed each split, index the vectors, embed the question the same way, then compare them numerically.", "kind": "concept", "c": "--c-basics", "t": 479, "children": [{"id": "n31", "zh": "切分文档", "en": "Split documents", "sum": "Documents get split because embedding models have limited context windows, from about 512 to 8,000 tokens or more.", "kind": "step", "c": "--c-basics", "t": 481}, {"id": "n32", "zh": "嵌入每个分块", "en": "Embed each split", "sum": "Each split is compressed into one vector that captures its semantic meaning.", "kind": "step", "c": "--c-basics", "t": 494}, {"id": "n33", "zh": "同样嵌入问题", "en": "Embed question identically", "sum": "The question is embedded in exactly the same way as the documents, so the two can be compared.", "kind": "step", "c": "--c-basics", "t": 505}, {"id": "n34", "zh": "向量比较", "en": "Compare vectors", "sum": "Some kind of numerical comparison between the vectors pulls out the documents relevant to the question.", "kind": "step", "c": "--c-basics", "t": 510}]}, {"id": "n35", "zh": "索引代码演示", "en": "Indexing code walkthrough", "sum": "A notebook demo that counts tokens, embeds text, compares vectors and builds a vector store.", "kind": "demo", "c": "--c-basics", "t": 523, "children": [{"id": "n36", "zh": "LangSmith 密钥", "en": "LangSmith API keys", "sum": "He sets LangSmith API keys so runs are traced for inspection.", "kind": "code", "c": "--c-basics", "t": 531}, {"id": "n37", "zh": "计算 token 数", "en": "Count tokens", "sum": "He counts the tokens in the question, because embedding models and LLMs both operate on tokens.", "kind": "step", "c": "--c-basics", "t": 553}, {"id": "n38", "zh": "OpenAIEmbeddings", "en": "OpenAIEmbeddings embed_query", "sum": "He embeds the question and a document with OpenAI embeddings, and each becomes a fixed-length vector of 1536 numbers.", "kind": "code", "c": "--c-basics", "t": 575}, {"id": "n39", "zh": "余弦相似度", "en": "Cosine similarity", "sum": "Cosine similarity is used to compare the question vector with the document vector.", "kind": "code", "c": "--c-basics", "t": 605}, {"id": "n40", "zh": "加载-切分-建索引", "en": "Load, split, index", "sum": "Each split is embedded and stored in the vector store along with a link back to its raw document.", "kind": "step", "c": "--c-basics", "t": 613}]}], "chapter": true}, {"id": "n41", "zh": "检索", "en": "Retrieval", "sum": "Retrieval as a nearest-neighbor search around the embedded question, with k setting how many documents come back.", "kind": "concept", "c": "--c-basics", "t": 640, "nb": "rag_from_scratch_1_to_4.ipynb", "children": [{"id": "n42", "zh": "流程回顾", "en": "Flow recap", "sum": "Chunks are embedded and stored in an index, and the embedded question triggers a similarity search that returns relevant splits.", "kind": "concept", "c": "--c-basics", "t": 671}, {"id": "n43", "zh": "3D 玩具嵌入空间", "en": "Toy 3D embedding space", "sum": "Picture each document as a point in a 3D space, placed according to its semantic content.", "kind": "concept", "c": "--c-basics", "t": 707, "children": [{"id": "n44", "zh": "距离近=语义相似", "en": "Proximity equals similar meaning", "sum": "Documents that sit close together carry similar semantic information, and this is the basis of modern vector-store search.", "kind": "concept", "c": "--c-basics", "t": 726}, {"id": "n45", "zh": "局部邻域搜索", "en": "Local neighborhood search", "sum": "Project the question into the same space and retrieve the documents near it.", "kind": "step", "c": "--c-basics", "t": 750}, {"id": "n46", "zh": "选择返回文档数", "en": "Choose number of documents", "sum": "You decide how many nearby documents to return: one, two, three or n.", "kind": "step", "c": "--c-basics", "t": 789}]}, {"id": "n47", "zh": "LangChain 集成", "en": "LangChain integrations", "sum": "There are many embedding models, indexes, document loaders and splitters, and they can be mixed to test different indexing and retrieval setups.", "kind": "concept", "c": "--c-basics", "t": 804}, {"id": "n48", "zh": "检索代码演示", "en": "Retrieval code demo", "sum": "He rebuilds the index and runs a k=1 nearest-neighbor query on the blog-post documents.", "kind": "demo", "c": "--c-basics", "t": 823, "children": [{"id": "n49", "zh": "重新加载与建索引", "en": "Reload, resplit, rebuild index", "sum": "The documents are loaded and split again, then every split is embedded and stored.", "kind": "step", "c": "--c-basics", "t": 849}, {"id": "n50", "zh": "参数 k", "en": "Parameter k", "sum": "k is the number of nearest neighbors the retriever fetches; here it is set to 1.", "kind": "code", "c": "--c-basics", "t": 873}, {"id": "n51", "zh": "get_relevant_documents", "en": "get_relevant_documents call", "sum": "He asks \"What is Task Decomposition?\" and gets back exactly one document, as k=1 predicts.", "kind": "code", "c": "--c-basics", "t": 897}, {"id": "n52", "zh": "LangSmith 查看", "en": "Inspect in LangSmith", "sum": "The trace shows the question and the single returned document, which describes approaches to task decomposition.", "kind": "demo", "c": "--c-basics", "t": 914}, {"id": "n53", "zh": "几行代码实现 KNN", "en": "KNN in few lines", "sum": "Takeaway: k-nearest-neighbor retrieval takes only a few lines of code.", "kind": "opinion", "c": "--c-basics", "t": 937}]}], "chapter": true}, {"id": "n54", "zh": "生成", "en": "Generation", "sum": "Putting the retrieved documents into a prompt, sending it to an LLM, and wiring it all together as an LCEL chain.", "kind": "concept", "c": "--c-basics", "t": 952, "nb": "rag_from_scratch_1_to_4.ipynb", "children": [{"id": "n55", "zh": "文档塞入上下文", "en": "Stuff docs into context", "sum": "In generation, the retrieved splits are packed into the LLM's context window to produce the answer.", "kind": "concept", "c": "--c-basics", "t": 981}, {"id": "n56", "zh": "带键的 Prompt 模板", "en": "Prompt template with keys", "sum": "A prompt is a placeholder with keys such as context and question, which work like slots for the documents and the question.", "kind": "concept", "c": "--c-basics", "t": 1039, "children": [{"id": "n57", "zh": "构建 dict", "en": "Build dict", "sum": "Build a dictionary from the retrieved documents and the question.", "kind": "step", "c": "--c-basics", "t": 1064}, {"id": "n58", "zh": "填充模板", "en": "Fill template", "sum": "Fill the template from the dict to get a prompt value.", "kind": "step", "c": "--c-basics", "t": 1072}, {"id": "n59", "zh": "调用聊天模型", "en": "Call chat model", "sum": "Pass the prompt value to a chat model, which returns chat messages.", "kind": "step", "c": "--c-basics", "t": 1077}, {"id": "n60", "zh": "解析为字符串", "en": "Parse to string", "sum": "Parse the chat message output into a plain string answer.", "kind": "step", "c": "--c-basics", "t": 1081}]}, {"id": "n61", "zh": "生成代码演示", "en": "Generation code demo", "sum": "He builds the retriever, defines a prompt and an LLM, composes them into a chain and traces it in LangSmith.", "kind": "demo", "c": "--c-basics", "t": 1089, "children": [{"id": "n62", "zh": "构建 retriever", "en": "Build retriever", "sum": "Load, split, embed and store the documents to get a retriever object.", "kind": "step", "c": "--c-basics", "t": 1113}, {"id": "n63", "zh": "简单 Prompt 模板", "en": "Simple prompt template", "sum": "The prompt asks the model to answer the question from the given context and has two variables, context and question.", "kind": "code", "c": "--c-basics", "t": 1134}, {"id": "n64", "zh": "LLM：GPT-3.5", "en": "LLM: GPT-3.5", "sum": "He uses GPT-3.5 as the chat model.", "kind": "code", "c": "--c-basics", "t": 1148}, {"id": "n65", "zh": "LCEL 链", "en": "LCEL chain", "sum": "LangChain Expression Language composes prompts, LLMs, parsers and retrievers; here the prompt is piped into the LLM.", "kind": "code", "c": "--c-basics", "t": 1152, "children": [{"id": "n66", "zh": "invoke/batch/stream", "en": "invoke / batch / stream", "sum": "Every LCEL chain shares common methods such as invoke, batch and stream.", "kind": "code", "c": "--c-basics", "t": 1179}, {"id": "n67", "zh": "用 dict 调用", "en": "Invoke with dict", "sum": "The chain is invoked with a dict whose context and question keys match the template variables.", "kind": "code", "c": "--c-basics", "t": 1187}]}, {"id": "n68", "zh": "LangSmith 追踪", "en": "LangSmith RunnableSequence trace", "sum": "The trace shows a simple RunnableSequence with the document passed in, the filled prompt and the answer.", "kind": "demo", "c": "--c-basics", "t": 1205}, {"id": "n69", "zh": "Prompt Hub 提示", "en": "Prompt hub RAG prompt", "sum": "He pulls a popular RAG prompt from the prompt hub; it adds more detail but follows the same idea.", "kind": "code", "c": "--c-basics", "t": 1232}, {"id": "n70", "zh": "自动化 RAG 链", "en": "Automated RAG chain", "sum": "The chain takes the question, runs the retriever to fill the context, then goes prompt, LLM, output parser.", "kind": "code", "c": "--c-basics", "t": 1253, "note": "之前是手动传入文档；现在问题传到 question 键，并自动触发 retriever 把文档填入 context。", "children": [{"id": "n71", "zh": "追踪完整运行", "en": "Trace end-to-end run", "sum": "The trace shows the retriever running, the documents it returned, and those documents being passed to the LLM for the final answer.", "kind": "demo", "c": "--c-basics", "t": 1299}]}]}, {"id": "n72", "zh": "基础流程的局限", "en": "Limits of basic pipeline", "sum": "Later videos cover more detailed techniques that fix limitations of this simple pipeline.", "kind": "opinion", "c": "--c-basics", "t": 1324}], "chapter": true}]}, {"id": "s156", "zh": "查询转换", "en": "Query Translation", "sum": "Rewrite, decompose, abstract or expand the user question before retrieval so it matches the right documents.", "kind": "concept", "c": "--c-qt", "t": 1334, "children": [{"id": "n74", "zh": "多查询", "en": "Multi-Query", "sum": "First query translation technique: rewrite one question into several differently worded versions and retrieve for each.", "kind": "concept", "c": "--c-qt", "t": 1334, "nb": "rag_from_scratch_5_to_9.ipynb", "children": [{"id": "n75", "zh": "查询转换概览", "en": "Query translation overview", "sum": "The first stage of an advanced RAG pipeline: transform the user's question so that retrieval works better.", "kind": "concept", "c": "--c-qt", "t": 1346, "children": [{"id": "n76", "zh": "问题：查询含糊不清", "en": "Problem: ambiguous, poorly written queries", "sum": "Since retrieval relies on semantic similarity, a vague or ill-posed query fails to pull back the right documents.", "kind": "concept", "c": "--c-qt", "t": 1364, "note": "检索靠 query 与文档的语义相似度，问题写得差就检索不到正确文档。"}, {"id": "n77", "zh": "方法分类", "en": "Taxonomy of approaches", "sum": "Lance groups query translation into rewriting, decomposing into sub-questions, and abstracting into higher-level questions.", "kind": "concept", "c": "--c-qt", "t": 1387, "children": [{"id": "n78", "zh": "查询重写", "en": "Query rewriting", "sum": "Reframe the question from different perspectives; examples are multi-query and RAG-Fusion.", "kind": "concept", "c": "--c-qt", "t": 1397}, {"id": "n79", "zh": "子问题（更具体）", "en": "Sub-questions (less abstract)", "sum": "Break a question into smaller sub-questions, as in Google's Least-to-Most paper.", "kind": "paper", "c": "--c-qt", "t": 1414}, {"id": "n80", "zh": "Step-back抽象化", "en": "Step-back (more abstract)", "sum": "Go the other way and generate a higher-level question from the input, covered in a later video.", "kind": "concept", "c": "--c-qt", "t": 1424}]}]}, {"id": "n81", "zh": "多查询直觉", "en": "Multi-query intuition", "sum": "Fan the question out into several wordings from different perspectives before retrieving.", "kind": "concept", "c": "--c-qt", "t": 1443, "children": [{"id": "n82", "zh": "原因：嵌入未对齐", "en": "Why: embedding misalignment", "sum": "The original wording, once embedded, may sit far from a relevant document in the high-dimensional embedding space.", "kind": "concept", "c": "--c-qt", "t": 1453}, {"id": "n83", "zh": "“散弹式”提升可靠性", "en": "Shotgun approach improves reliability", "sum": "Because questions and documents embed with subtle differences, several rephrasings make it more likely that the wanted document gets retrieved.", "kind": "opinion", "c": "--c-qt", "t": 1486}, {"id": "n84", "zh": "与检索结合", "en": "Combine with retrieval", "sum": "Retrieve for each fanned-out question, merge the results somehow, then run RAG over them.", "kind": "concept", "c": "--c-qt", "t": 1496}]}, {"id": "n85", "zh": "Notebook 演示", "en": "Notebook demo", "sum": "Builds multi-query retrieval and RAG in a shared notebook, then inspects each step in LangSmith.", "kind": "demo", "c": "--c-qt", "t": 1511, "children": [{"id": "n86", "zh": "环境与LangSmith", "en": "Setup: packages, LangSmith keys", "sum": "Installs packages and sets LangSmith API keys so traces can be inspected later.", "kind": "step", "c": "--c-qt", "t": 1514}, {"id": "n87", "zh": "Chroma索引博客", "en": "Index agents blog in Chroma", "sum": "Loads a blog post about agents, splits it, and indexes it in a local Chroma vector store.", "kind": "step", "c": "--c-qt", "t": 1525}, {"id": "n88", "zh": "查询生成链", "en": "generate_queries chain", "sum": "A prompt asks the LLM to reframe the question several ways; the output is parsed to a string and split on newlines into a list.", "kind": "code", "c": "--c-qt", "t": 1541, "note": "prompt → LLM → StrOutputParser → 按换行切分，得到问题列表。"}, {"id": "n89", "zh": "逐问题检索+去重合并", "en": "Per-question retrieval + unique union", "sum": "Each generated question is sent to the retriever, and get_unique_union merges all results into a de-duplicated set.", "kind": "code", "c": "--c-qt", "t": 1569, "children": [{"id": "n90", "zh": "逐问题检索", "en": "retriever.map()", "sum": "Applies the retriever to every question in the list, one retrieval per question.", "kind": "code", "c": "--c-qt", "t": 1575}, {"id": "n91", "zh": "去重合并", "en": "get_unique_union", "sum": "Helper that takes the unique union of documents across all the retrievals.", "kind": "code", "c": "--c-qt", "t": 1581}]}, {"id": "n92", "zh": "追踪检索过程", "en": "LangSmith trace of retrieval", "sum": "The trace shows the query-generation prompt, the rephrased questions, and an independent retrieval for each one.", "kind": "demo", "c": "--c-qt", "t": 1594}, {"id": "n93", "zh": "最终 RAG 链", "en": "Final RAG chain", "sum": "The retrieval chain supplies the context, the question is passed through, and a RAG prompt, LLM and parser produce the answer.", "kind": "code", "c": "--c-qt", "t": 1625, "children": [{"id": "n94", "zh": "追踪：五个改写问题", "en": "Trace: five rephrasings", "sum": "End-to-end trace shows five rephrased questions, each retrieved, with the unique docs placed into the final answer prompt.", "kind": "demo", "c": "--c-qt", "t": 1648}]}, {"id": "n95", "zh": "查看中间步骤", "en": "LangSmith for intermediate steps", "sum": "He highlights LangSmith as an easy way to inspect the intermediate questions created during generation.", "kind": "opinion", "c": "--c-qt", "t": 1679}]}], "chapter": true}, {"id": "n96", "zh": "RAG-Fusion", "en": "RAG-Fusion", "sum": "A rewriting method like multi-query that adds a reciprocal rank fusion step to rank the merged retrieved documents.", "kind": "concept", "c": "--c-qt", "t": 1700, "nb": "rag_from_scratch_5_to_9.ipynb", "children": [{"id": "n97", "zh": "回顾方法地图", "en": "Recap of approach map", "sum": "Repeats the three families: rewriting, sub-questions solved independently, and step-back higher-level questions.", "kind": "concept", "c": "--c-qt", "t": 1724}, {"id": "n98", "zh": "与多查询的区别", "en": "Difference from multi-query", "sum": "The input stage (rephrase, retrieve for each) stays the same; the only addition is a clever ranking of retrieved documents.", "kind": "concept", "c": "--c-qt", "t": 1765, "children": [{"id": "n99", "zh": "倒数排序融合 RRF", "en": "Reciprocal Rank Fusion (RRF)", "sum": "Looks at documents across several ranked lists and aggregates them into one final consolidated ranking.", "kind": "concept", "c": "--c-qt", "t": 1776, "note": "把多个检索结果的排名列表合并成一个统一排名。"}]}, {"id": "n100", "zh": "Notebook 演示", "en": "Notebook demo", "sum": "Implements RAG-Fusion in the same notebook and traces it in LangSmith.", "kind": "demo", "c": "--c-qt", "t": 1794, "children": [{"id": "n101", "zh": "生成4个查询", "en": "Prompt: generate 4 search queries", "sum": "A helpful-assistant prompt asks for multiple search queries from one input, with the output limited to four queries.", "kind": "code", "c": "--c-qt", "t": 1813}, {"id": "n102", "zh": "查询生成链", "en": "Query generation chain", "sum": "Prompt is fed to the LLM and the output is split on newlines into a list, just like multi-query.", "kind": "code", "c": "--c-qt", "t": 1830}, {"id": "n103", "zh": "检索得到列表的列表", "en": "Retrieval gives list of lists", "sum": "Each of the four queries returns its own document list, giving a list of lists to consolidate.", "kind": "step", "c": "--c-qt", "t": 1851}, {"id": "n104", "zh": "RRF 排序函数", "en": "reciprocal_rank_fusion function", "sum": "Ranking function that fuses the four retrieval lists into one ranked list.", "kind": "code", "c": "--c-qt", "t": 1869}, {"id": "n105", "zh": "追踪：4 次检索→6 篇", "en": "Trace: 4 retrievals to 6 docs", "sum": "LangSmith shows four queries and retrievals ranked into a final list of six unique documents.", "kind": "demo", "c": "--c-qt", "t": 1915}, {"id": "n106", "zh": "完整 RAG 链", "en": "Full RAG chain", "sum": "Ranked documents become the context, the question passes through, then RAG prompt, LLM and output parser give the answer.", "kind": "code", "c": "--c-qt", "t": 1957}]}, {"id": "n107", "zh": "RRF 适用场景", "en": "When RRF helps", "sum": "Useful when retrieving across different vector stores or many reworded queries and you need one consolidated ranking.", "kind": "tradeoff", "c": "--c-qt", "t": 2005, "children": [{"id": "n108", "zh": "只取 top-k 文档", "en": "Keep only top-k docs", "sum": "A unified ranking makes it easy to pass, say, only the top three documents to generation.", "kind": "tradeoff", "c": "--c-qt", "t": 2021}]}], "chapter": true}, {"id": "n109", "zh": "问题分解", "en": "Decomposition", "sum": "Break an input question into a set of sub-questions and solve them, either sequentially or independently.", "kind": "concept", "c": "--c-qt", "t": 2037, "nb": "rag_from_scratch_5_to_9.ipynb", "children": [{"id": "n110", "zh": "分解为子问题", "en": "Decompose into sub-questions", "sum": "A family of techniques, distinct from rewriting, that splits a question into sub-problems; especially useful for some problems.", "kind": "concept", "c": "--c-qt", "t": 2047}, {"id": "n111", "zh": "相关论文", "en": "Papers", "sum": "Two papers are combined: Google's Least-to-Most prompting and IRCoT.", "kind": "paper", "c": "--c-qt", "t": 2086, "children": [{"id": "n112", "zh": "LtM 由少到多提示", "en": "Least-to-Most prompting (Google)", "sum": "Decomposes a problem into sub-problems, then solves them in sequence, each building on the previous answer.", "kind": "paper", "c": "--c-qt", "t": 2089, "children": [{"id": "n113", "zh": "末字母拼接示例", "en": "Last-letter concatenation example", "sum": "Input \"think machine learning\" becomes three growing sub-problems: think, think machine, think machine learning.", "kind": "demo", "c": "--c-qt", "t": 2102, "children": [{"id": "n114", "zh": "逐步得到 \"keg\"", "en": "Sequential build-up to \"keg\"", "sum": "Solving \"think machine\" gives \"ke\"; building on it for the full phrase yields \"keg\".", "kind": "step", "c": "--c-qt", "t": 2123}]}]}, {"id": "n115", "zh": "IRCoT 交错检索", "en": "IRCoT (interleaved retrieval + CoT)", "sum": "Interleaves retrieval with chain-of-thought reasoning, retrieving dynamically as the reasoning moves forward.", "kind": "paper", "c": "--c-qt", "t": 2152}, {"id": "n116", "zh": "组合思路", "en": "Combined approach", "sum": "Answer one sub-question with retrieval, then use that answer to help answer the next, and so on.", "kind": "concept", "c": "--c-qt", "t": 2163}]}, {"id": "n117", "zh": "Notebook 演示", "en": "Notebook demo", "sum": "Uses the agents blog index to decompose a question and answer the sub-questions.", "kind": "demo", "c": "--c-qt", "t": 2197, "children": [{"id": "n118", "zh": "分解 prompt 链", "en": "Decomposition prompt chain", "sum": "A prompt asks the model to split the input into sub-questions that can each be solved alone (generate_queries_decomposition).", "kind": "code", "c": "--c-qt", "t": 2209}, {"id": "n119", "zh": "示例：agent组件", "en": "Example: LLM agent components", "sum": "The question asks for the main components of an LLM-powered autonomous agent system.", "kind": "demo", "c": "--c-qt", "t": 2223, "children": [{"id": "n120", "zh": "生成三个子问题", "en": "Three generated sub-questions", "sum": "Output: what LLM technology is, what the components are, and how they interact; he calls this a sane breakdown.", "kind": "step", "c": "--c-qt", "t": 2236}]}, {"id": "n121", "zh": "递归式回答", "en": "Recursive answering", "sum": "Each sub-question is answered using its own retrieval plus all previously answered question-answer pairs.", "kind": "step", "c": "--c-qt", "t": 2252, "children": [{"id": "n122", "zh": "问题+QA对+上下文", "en": "Prompt: question + Q&A pairs + context", "sum": "The prompt combines the current question, prior Q&A pairs (q_a_pairs), and the retrieved context.", "kind": "code", "c": "--c-qt", "t": 2255}, {"id": "n123", "zh": "追踪显示 QA 累积", "en": "Trace shows accumulating Q&A", "sum": "Q1 uses only retrieval; Q2's prompt includes the Q1 pair; Q3 includes both earlier pairs plus new retrieval.", "kind": "demo", "c": "--c-qt", "t": 2303, "note": "每轮把上一轮的问答对追加进 prompt，逐步构建最终答案。"}]}, {"id": "n124", "zh": "替代：独立回答", "en": "Alternative: answer individually", "sum": "Answer every sub-question in parallel, then concatenate the Q&A pairs to synthesize a final answer.", "kind": "step", "c": "--c-qt", "t": 2369, "children": [{"id": "n125", "zh": "与递归式的权衡", "en": "Trade-off vs recursive", "sum": "Less interesting because answers don't inform each other, but suited to sets of independent questions.", "kind": "tradeoff", "c": "--c-qt", "t": 2383}, {"id": "n126", "zh": "追踪：拼接 QA 对", "en": "Trace: concatenated QA pairs", "sum": "The trace confirms all QA pairs are simply concatenated to produce the final answer.", "kind": "demo", "c": "--c-qt", "t": 2414}]}]}], "chapter": true}, {"id": "n127", "zh": "Step-Back 提示", "en": "Step-Back Prompting", "sum": "The opposite of decomposition: ask a more abstract, higher-level question and retrieve for it alongside the original.", "kind": "concept", "c": "--c-qt", "t": 2431, "nb": "rag_from_scratch_5_to_9.ipynb", "children": [{"id": "n128", "zh": "在方法地图中的位置", "en": "Position in the approach map", "sum": "Rewriting adds perspectives and decomposition makes questions less abstract; step-back moves toward more abstraction.", "kind": "concept", "c": "--c-qt", "t": 2462}, {"id": "n129", "zh": "Step-back论文", "en": "Step-back paper (Google)", "sum": "Google work that uses few-shot prompting to produce more abstract step-back questions from original ones.", "kind": "paper", "c": "--c-qt", "t": 2508, "children": [{"id": "n130", "zh": "few-shot示例对", "en": "Few-shot original→step-back pairs", "sum": "The prompt gives several example pairs of an original question and its step-back version.", "kind": "concept", "c": "--c-qt", "t": 2535}, {"id": "n131", "zh": "例：出生地→个人经历", "en": "Example: birthplace → personal history", "sum": "A question about which country someone was born in steps back to asking for that person's general history.", "kind": "demo", "c": "--c-qt", "t": 2578}, {"id": "n132", "zh": "抽象程度光谱图", "en": "Abstraction spectrum diagram", "sum": "A diagram arranges the approaches from less abstraction to more abstraction.", "kind": "concept", "c": "--c-qt", "t": 2605}]}, {"id": "n133", "zh": "Notebook 演示", "en": "Notebook demo", "sum": "Builds step-back prompting with few-shot examples borrowed from the paper.", "kind": "demo", "c": "--c-qt", "t": 2615, "children": [{"id": "n134", "zh": "论文few-shot示例", "en": "Few-shot prompt from paper", "sum": "Uses paper examples such as asking whether The Police members can make lawful arrests (FewShotChatMessagePromptTemplate).", "kind": "code", "c": "--c-qt", "t": 2615}, {"id": "n135", "zh": "系统prompt改写", "en": "System prompt: step back, paraphrase", "sum": "The model plays a world-knowledge expert and rewrites the question into a more generic one that's easier to answer.", "kind": "code", "c": "--c-qt", "t": 2642}, {"id": "n136", "zh": "示例：任务分解问题", "en": "Example: task decomposition question", "sum": "\"Task decomposition for LLM agents\" steps back to the general process of task decomposition, without the agent focus.", "kind": "demo", "c": "--c-qt", "t": 2656}, {"id": "n137", "zh": "双路检索与回答", "en": "Dual retrieval and response prompt", "sum": "Retrieves for both the original and the step-back question and puts both contexts into a response prompt.", "kind": "step", "c": "--c-qt", "t": 2676, "children": [{"id": "n138", "zh": "Prompt 键", "en": "Prompt keys", "sum": "A dict feeds normal_context, step_back_context and the original question into the response prompt.", "kind": "code", "c": "--c-qt", "t": 2713}, {"id": "n139", "zh": "LangSmith 追踪", "en": "LangSmith trace", "sum": "Shows the few-shot prompt, the generated step-back question, both retrievals, and the combined final prompt and answer.", "kind": "demo", "c": "--c-qt", "t": 2738}]}]}, {"id": "n140", "zh": "Step-back场景", "en": "When step-back helps", "sum": "Depends on the domain; most useful when users' questions rest on underlying conceptual knowledge.", "kind": "opinion", "c": "--c-qt", "t": 2795, "children": [{"id": "n141", "zh": "教材/技术文档", "en": "Textbooks / technical docs", "sum": "Where some chapters cover high-level concepts and others cover implementation details, separate step-back retrieval could help a lot.", "kind": "opinion", "c": "--c-qt", "t": 2822}]}], "chapter": true}, {"id": "n142", "zh": "HyDE 假设文档", "en": "HyDE", "sum": "Hypothetical Document Embeddings: generate a fake document answering the question and retrieve with it instead of the raw question.", "kind": "concept", "c": "--c-qt", "t": 2844, "nb": "rag_from_scratch_5_to_9.ipynb", "children": [{"id": "n143", "zh": "动机：问题≠文档", "en": "Motivation: questions ≠ documents", "sum": "Basic RAG embeds questions and documents the same way, but they are very different kinds of text.", "kind": "concept", "c": "--c-qt", "t": 2866, "children": [{"id": "n144", "zh": "文档长密，问题简短", "en": "Docs long and dense; questions terse", "sum": "Documents are large chunks from dense sources, while user questions are short, terse and possibly badly worded.", "kind": "concept", "c": "--c-qt", "t": 2886}]}, {"id": "n145", "zh": "把问题映射到文档空间", "en": "Map question into document space", "sum": "Generate a hypothetical document from the question so retrieval compares document against document.", "kind": "concept", "c": "--c-qt", "t": 2899, "children": [{"id": "n146", "zh": "嵌入空间中更接近", "en": "Closer in embedding space", "sum": "In some cases the hypothetical document lies nearer the target document than the sparse raw question does.", "kind": "concept", "c": "--c-qt", "t": 2914}]}, {"id": "n147", "zh": "Notebook 演示", "en": "Notebook demo", "sum": "He calls HyDE easy to implement and shows it on the already-indexed agents blog post.", "kind": "demo", "c": "--c-qt", "t": 2938, "children": [{"id": "n148", "zh": "生成论文段落", "en": "Prompt: write a paper passage", "sum": "A prompt asks the model for a paper passage that answers the question (prompt_hyde).", "kind": "code", "c": "--c-qt", "t": 2955}, {"id": "n149", "zh": "生成链", "en": "Chain: ChatOpenAI → StrOutputParser", "sum": "The prompt is piped to ChatOpenAI and then a string output parser to produce the hypothetical document (generate_docs_for_retrieval).", "kind": "code", "c": "--c-qt", "t": 2966}, {"id": "n150", "zh": "源自LLM知识", "en": "Passage from LLM world knowledge", "sum": "The generated passage draws on knowledge built into the LLM, which he sees as a reasonable source for hypothetical docs.", "kind": "step", "c": "--c-qt", "t": 2978}, {"id": "n151", "zh": "用假设文档检索", "en": "Retrieve with hypothetical doc", "sum": "The hypothetical document is embedded and piped into the retriever to fetch related chunks from the index.", "kind": "step", "c": "--c-qt", "t": 2988}, {"id": "n152", "zh": "用检索结果做 RAG", "en": "Final RAG with retrieved docs", "sum": "The retrieved docs and the original question go into the RAG prompt and chain to produce an answer.", "kind": "step", "c": "--c-qt", "t": 3011}, {"id": "n153", "zh": "LangSmith 追踪", "en": "LangSmith trace", "sum": "Trace shows ChatOpenAI generating the passage, then retrieval returning docs related to that passage.", "kind": "demo", "c": "--c-qt", "t": 3032}]}, {"id": "n154", "zh": "注意：原问题可能就够", "en": "Caveat: raw question may suffice", "sum": "On this index, the raw question likely retrieves many of the same documents; elsewhere HyDE may matter more.", "kind": "tradeoff", "c": "--c-qt", "t": 3087}, {"id": "n155", "zh": "按领域调 prompt", "en": "Tune prompt per domain", "sum": "People report good HyDE results in some domains; the generation prompt can be tuned freely, so it's worth experimenting.", "kind": "opinion", "c": "--c-qt", "t": 3104}], "chapter": true}]}, {"id": "n157", "zh": "路由", "en": "Routing", "sum": "Sending a (possibly translated or decomposed) question to the most appropriate data source, prompt, or index.", "kind": "concept", "c": "--c-route", "t": 3127, "nb": "rag_from_scratch_10_and_11.ipynb", "children": [{"id": "n158", "zh": "在流程中的位置", "en": "Where routing fits", "sum": "Routing comes right after query translation: once the question is rewritten, pick which source should answer it.", "kind": "concept", "c": "--c-route", "t": 3147, "note": "示意图中有三种源：vector store、关系型 DB、图 DB，根据问题内容选择。"}, {"id": "n159", "zh": "路由目标很通用", "en": "Targets can be anything", "sum": "Destinations need not be databases; a router can choose among prompts, vector stores, or any arbitrary downstream place.", "kind": "concept", "c": "--c-route", "t": 3209}, {"id": "n160", "zh": "逻辑路由", "en": "Logical routing", "sum": "Give the LLM knowledge of available sources and let it reason about which one fits the question.", "kind": "concept", "c": "--c-route", "t": 3172, "children": [{"id": "n161", "zh": "分类 + function calling", "en": "Classification plus function calling", "sum": "Treat routing as classification where function calling forces structured output limited to the allowed options.", "kind": "concept", "c": "--c-route", "t": 3266}, {"id": "n162", "zh": "编程文档路由演示", "en": "Programming-docs routing demo", "sum": "Toy setup routes a question to Python, JS, or Golang documentation.", "kind": "demo", "c": "--c-route", "t": 3237, "children": [{"id": "n163", "zh": "RouteQuery 数据模型", "en": "RouteQuery data model", "sum": "A Pydantic class describing the structured object the LLM must output for routing.", "kind": "code", "c": "--c-route", "t": 3279, "children": [{"id": "n164", "zh": "datasource 字段", "en": "datasource field", "sum": "The single output field, restricted to python_docs, js_docs, or golang_docs, returned as a JSON string.", "kind": "code", "c": "--c-route", "t": 3322}]}, {"id": "n165", "zh": "with_structured_output 绑定", "en": "with_structured_output binding", "sum": "Under the hood converts the data model into a function schema and binds it to the LLM.", "kind": "code", "c": "--c-route", "t": 3349, "children": [{"id": "n166", "zh": "转为 OpenAI 函数 schema", "en": "Object to OpenAI function schema", "sum": "The class definition becomes an OpenAI-style function schema the model invokes to shape its answer.", "kind": "step", "c": "--c-route", "t": 3292}, {"id": "n167", "zh": "JSON 解析为 Pydantic", "en": "Parse JSON to Pydantic", "sum": "A parser built from the same class turns the returned JSON string into a Pydantic object.", "kind": "step", "c": "--c-route", "t": 3328}]}, {"id": "n168", "zh": "路由系统提示词", "en": "Router system prompt", "sum": "Prompt tells the model it is an expert at routing questions by the programming language they reference.", "kind": "code", "c": "--c-route", "t": 3358}, {"id": "n169", "zh": "Python 问题测试", "en": "Python question test", "sum": "Asking about Python code returns a RouteQuery object with datasource python_docs, which can be read as a string.", "kind": "demo", "c": "--c-route", "t": 3370}, {"id": "n170", "zh": "choose_route 分支", "en": "choose_route branching", "sum": "A function inspects the routing output and sends the question to the matching retriever chain per language.", "kind": "code", "c": "--c-route", "t": 3393, "note": "例如 python_docs 接 Python 检索链，js_docs 接 JS 检索链，以此类推。"}]}, {"id": "n171", "zh": "结构化输出是核心", "en": "Structured output does heavy lifting", "sum": "He stresses the key work is turning a free-form question into a constrained object with few allowed types.", "kind": "opinion", "c": "--c-route", "t": 3426}]}, {"id": "n172", "zh": "语义路由", "en": "Semantic routing", "sum": "Embed the question and candidate prompts, compute similarity, and pick the closest prompt.", "kind": "concept", "c": "--c-route", "t": 3193, "children": [{"id": "n173", "zh": "比逻辑路由更直接", "en": "Simpler than logical routing", "sum": "He considers semantic routing perhaps even more straightforward given the embedding work seen earlier.", "kind": "opinion", "c": "--c-route", "t": 3443}, {"id": "n174", "zh": "物理/数学提示词演示", "en": "Physics vs math prompt demo", "sum": "Two expert prompts, physics and math, are embedded ahead of time as routing candidates.", "kind": "demo", "c": "--c-route", "t": 3452, "children": [{"id": "n175", "zh": "RunnableLambda 提示路由", "en": "RunnableLambda prompt router", "sum": "Function embeds the question, scores similarity against prompt embeddings, and returns the most similar prompt.", "kind": "code", "c": "--c-route", "t": 3466}, {"id": "n176", "zh": "黑洞问题测试", "en": "Black hole question", "sum": "Asking what a black hole is selects the physics prompt and yields a physics-style answer.", "kind": "demo", "c": "--c-route", "t": 3485}]}]}, {"id": "n177", "zh": "路由小结", "en": "Routing takeaways", "sum": "Two routing methods; swap coding languages for described vector, graph, and relational DBs in real use.", "kind": "opinion", "c": "--c-route", "t": 3502, "note": "LLM 既推理又返回可干净解析的对象，便于在路由函数中分支；他鼓励大家动手实验。"}], "chapter": true}, {"id": "n178", "zh": "查询构建", "en": "Query Construction", "sum": "Converting a natural-language question into the domain-specific query language of the chosen data source.", "kind": "concept", "c": "--c-qc", "t": 3548, "nb": "rag_from_scratch_10_and_11.ipynb", "children": [{"id": "n179", "zh": "在流程中的位置", "en": "Pipeline position", "sum": "Follows query translation and routing: after choosing a source, express the question in that source's query language.", "kind": "concept", "c": "--c-qc", "t": 3555}, {"id": "n180", "zh": "聚焦：向量库元数据过滤", "en": "Focus: vector store metadata filters", "sum": "This lesson covers going from natural language to metadata filters on vector stores.", "kind": "concept", "c": "--c-qc", "t": 3587, "note": "大多数向量库支持在已索引 chunk 上做结构化的元数据过滤。"}, {"id": "n181", "zh": "问题描述", "en": "Problem statement", "sum": "Given an index of LangChain video transcripts, a question like videos on Chat LangChain after 2024 needs structured filters.", "kind": "demo", "c": "--c-qc", "t": 3596, "note": "目标：检索主题为 Chat LangChain 且发布日期在 2024 之后的所有 chunk。"}, {"id": "n182", "zh": "基于 function calling", "en": "Function-calling approach", "sum": "Use function calling (e.g. OpenAI or other providers) to emit queries that follow a supplied schema.", "kind": "concept", "c": "--c-qc", "t": 3641, "children": [{"id": "n183", "zh": "提供元数据字段", "en": "Provide metadata fields", "sum": "Describe the vector store's available metadata fields to the model as information.", "kind": "step", "c": "--c-qc", "t": 3650}, {"id": "n184", "zh": "生成符合 schema 的查询", "en": "Generate schema-conforming query", "sum": "The model produces queries that adhere to the provided schema.", "kind": "step", "c": "--c-qc", "t": 3660}, {"id": "n185", "zh": "解析为 Pydantic 用于检索", "en": "Parse to Pydantic for search", "sum": "The output is parsed into a Pydantic object that can then drive the search.", "kind": "step", "c": "--c-qc", "t": 3666}]}, {"id": "n186", "zh": "YouTube 转录元数据", "en": "YouTube transcript metadata", "sum": "Loading an example video shows metadata such as description, URL, publish date, and length.", "kind": "demo", "c": "--c-qc", "t": 3682}, {"id": "n187", "zh": "TutorialSearch schema", "en": "TutorialSearch schema", "sum": "A Pydantic object capturing every search and filter the hypothetical tutorial-video index supports.", "kind": "code", "c": "--c-qc", "t": 3725, "children": [{"id": "n188", "zh": "语义检索字段", "en": "Semantic search fields", "sum": "content_search and title_search are unstructured similarity searches over transcript contents and titles.", "kind": "code", "c": "--c-qc", "t": 3732}, {"id": "n189", "zh": "范围过滤字段", "en": "Range filter fields", "sum": "Structured range filters on view count, publication date (earliest/latest), and video length.", "kind": "code", "c": "--c-qc", "t": 3742}]}, {"id": "n190", "zh": "查询构建提示词", "en": "Query-construction prompt", "sum": "System prompt casts the model as an expert turning questions into optimized database queries over tutorial videos.", "kind": "code", "c": "--c-qc", "t": 3753}, {"id": "n191", "zh": "关键：绑定 schema", "en": "Binding schema is key", "sum": "with_structured_output binds the index-describing Pydantic object as a function schema, then parses the returned JSON.", "kind": "code", "c": "--c-qc", "t": 3767, "note": "与路由中相同的流程：对象→函数 schema（如 OpenAI）→绑定模型→得到 JSON→解析为 Pydantic。", "children": [{"id": "n192", "zh": "query_analyzer 链", "en": "query_analyzer chain", "sum": "The prompt combined with the structured LLM forms the query analyzer chain used for the tests.", "kind": "code", "c": "--c-qc", "t": 3806}]}, {"id": "n193", "zh": "查询分析测试", "en": "Query analyzer tests", "sum": "Several questions show which fields the model fills depending on what the question asks.", "kind": "demo", "c": "--c-qc", "t": 3808, "children": [{"id": "n194", "zh": "纯语义输入", "en": "Purely semantic input", "sum": "The input rag from scratch yields only content_search and title_search, as expected.", "kind": "demo", "c": "--c-qc", "t": 3810}, {"id": "n195", "zh": "带日期过滤的问题", "en": "Question with date filter", "sum": "Adding a date constraint keeps the semantic search and adds earliest/latest publish date filters.", "kind": "demo", "c": "--c-qc", "t": 3821}, {"id": "n196", "zh": "2024 之前的 Chat LangChain", "en": "Chat LangChain before 2024", "sum": "A reworded question with a different date bound returns content, title, and date searches.", "kind": "demo", "c": "--c-qc", "t": 3838}]}, {"id": "n197", "zh": "非结构化到结构化通用策略", "en": "General unstructured-to-structured strategy", "sum": "The technique maps unstructured input to a structured query object following any schema you supply.", "kind": "concept", "c": "--c-qc", "t": 3854, "children": [{"id": "n198", "zh": "schema 依赖具体向量库", "en": "Schema tied to your store", "sum": "The TutorialSearch object must reflect the specific capabilities of your vector store of interest.", "kind": "tradeoff", "c": "--c-qc", "t": 3872, "note": "他附上了 LangChain 与各向量库集成的文档链接，可参考具体实现。"}]}, {"id": "n199", "zh": "实用的即时过滤技巧", "en": "Useful on-the-fly filtering trick", "sum": "He calls it a convenient trick for on-the-fly metadata filtering from natural language across many vector DBs.", "kind": "opinion", "c": "--c-qc", "t": 3890}], "chapter": true}, {"id": "s266", "zh": "高级索引", "en": "Advanced Indexing", "sum": "Index documents so they are easier to retrieve: summaries that point to full docs, hierarchical summary trees, and token-level embeddings.", "kind": "concept", "c": "--c-idx", "t": 3905, "children": [{"id": "n200", "zh": "多表示索引", "en": "Multi-Representation Indexing", "sum": "Part 12: index an LLM-written summary of each document for search, but hand the full raw document to the LLM.", "kind": "concept", "c": "--c-idx", "t": 3905, "nb": "rag_from_scratch_12_to_14.ipynb", "children": [{"id": "n201", "zh": "回顾：索引的位置", "en": "Recap: where indexing fits", "sum": "Earlier parts covered query translation, routing to vector/graph/SQL stores, and query construction, including text-to-SQL and text-to-Cypher.", "kind": "concept", "c": "--c-idx", "t": 3917, "note": "现在转向 vector store 的索引技术。"}, {"id": "n202", "zh": "Proposition 索引论文", "en": "Proposition indexing paper", "sum": "The paper's main point is that the raw document and the unit you retrieve with can be separate things.", "kind": "paper", "c": "--c-idx", "t": 3961, "children": [{"id": "n203", "zh": "常规：直接嵌入切块", "en": "Typical: embed splits directly", "sum": "The usual pipeline splits a document into pieces and embeds each piece as it is.", "kind": "concept", "c": "--c-idx", "t": 3975}, {"id": "n204", "zh": "Proposition=LLM提炼", "en": "Proposition = LLM-distilled split", "sum": "An LLM rewrites each split into a crisper, summary-like proposition that retrieves better.", "kind": "concept", "c": "--c-idx", "t": 3995}]}, {"id": "n205", "zh": "摘要→全文机制", "en": "Summary-to-full-doc mechanism", "sum": "LangChain extends the idea: search runs over summaries, and the full document comes back for generation.", "kind": "concept", "c": "--c-idx", "t": 4015, "children": [{"id": "n206", "zh": "生成摘要并嵌入", "en": "Summarize and embed summary", "sum": "An LLM summarizes each document, and the summary, holding its keywords and main ideas, is the vector that gets embedded.", "kind": "step", "c": "--c-idx", "t": 4027}, {"id": "n207", "zh": "原文存入 docstore", "en": "Store raw doc in docstore", "sum": "The untouched full document is kept separately in a document store, not in the vector store.", "kind": "step", "c": "--c-idx", "t": 4062}, {"id": "n208", "zh": "命中摘要返回全文", "en": "Match summary, return full doc", "sum": "The question is matched against summary embeddings, and the linked full document is returned to the LLM.", "kind": "step", "c": "--c-idx", "t": 4067}, {"id": "n209", "zh": "动机：长上下文 LLM", "en": "Why: long-context LLMs", "sum": "Long-context LLMs can read a whole document, so you skip splitting and the model has full context to answer.", "kind": "tradeoff", "c": "--c-idx", "t": 4076}]}, {"id": "n210", "zh": "Notebook 演示", "en": "Notebook demo", "sum": "Two blog posts are summarized, indexed through a MultiVectorRetriever, and queried with 'memory and agents'.", "kind": "demo", "c": "--c-idx", "t": 4103, "children": [{"id": "n211", "zh": "环境：pip 与 LangSmith", "en": "Setup: pip, LangSmith keys", "sum": "The notebook installs its packages and sets the API keys used for LangSmith tracing.", "kind": "step", "c": "--c-idx", "t": 4108}, {"id": "n212", "zh": "加载两篇博客", "en": "Load two blog posts", "sum": "One post covers autonomous agents and the other covers high-quality human data for training.", "kind": "demo", "c": "--c-idx", "t": 4117}, {"id": "n213", "zh": "逐篇生成摘要", "en": "Generate per-doc summaries", "sum": "An LLM chain writes one summary per document; this is the raw-docs-to-summaries step.", "kind": "step", "c": "--c-idx", "t": 4125}, {"id": "n214", "zh": "组装 MultiVectorRetriever", "en": "MultiVectorRetriever assembly", "sum": "The retriever joins a vector store of summaries to a byte store of full documents.", "kind": "code", "c": "--c-idx", "t": 4148, "children": [{"id": "n215", "zh": "摘要向量库", "en": "Vector store for summaries", "sum": "A vector store indexes only the summary embeddings.", "kind": "code", "c": "--c-idx", "t": 4148}, {"id": "n216", "zh": "InMemoryByteStore 文档库", "en": "InMemoryByteStore as docstore", "sum": "A byte store keeps the full raw documents.", "kind": "code", "c": "--c-idx", "t": 4165}, {"id": "n217", "zh": "doc_id 关联两库", "en": "doc_id links both stores", "sum": "Each document gets a new ID, attached to its summary's metadata so the full document can be looked up.", "kind": "code", "c": "--c-idx", "t": 4172}]}, {"id": "n218", "zh": "写入摘要与原文", "en": "Add summaries and raw docs", "sum": "Summary documents go into the vector store, and (doc_id, full doc) pairs go into the docstore.", "kind": "step", "c": "--c-idx", "t": 4201}, {"id": "n219", "zh": "查询 memory and agents", "en": "Query 'memory and agents'", "sum": "The same query is run directly on the vector store and then through the combined retriever.", "kind": "demo", "c": "--c-idx", "t": 4212, "children": [{"id": "n220", "zh": "similarity_search 得摘要", "en": "similarity_search returns summary", "sum": "Searching the vector store directly returns the summary of the agents post.", "kind": "code", "c": "--c-idx", "t": 4214}, {"id": "n221", "zh": "retriever 返回全文", "en": "get_relevant_documents returns article", "sum": "The retriever maps the matched summary through doc_id and returns the whole agents web page.", "kind": "code", "c": "--c-idx", "t": 4227}]}]}, {"id": "n222", "zh": "结论：简单实用", "en": "Takeaway: simple, useful trick", "sum": "He calls it a simple, useful way to go from summary-style indexing to full-document retrieval, especially with long-context LLMs.", "kind": "opinion", "c": "--c-idx", "t": 4283}], "chapter": true}, {"id": "n223", "zh": "RAPTOR 层次索引", "en": "RAPTOR Hierarchical Indexing", "sum": "Part 13: build a tree of recursive cluster summaries and index every level together, so retrieval works at any level of abstraction.", "kind": "concept", "c": "--c-idx", "t": 4299, "nb": "rag_from_scratch_12_to_14.ipynb", "children": [{"id": "n224", "zh": "索引技术之一", "en": "One of several indexing techniques", "sum": "RAPTOR sits alongside multi-representation indexing; for chunking strategies he points to a separate, recommended video.", "kind": "concept", "c": "--c-idx", "t": 4311}, {"id": "n225", "zh": "动机：问题粒度", "en": "Motivation: question granularity", "sum": "Questions range from detail lookups to broad syntheses, and plain kNN retrieval handles the broad kind poorly.", "kind": "concept", "c": "--c-idx", "t": 4334, "children": [{"id": "n226", "zh": "低层问题", "en": "Low-level questions", "sum": "These need fine detail found in a single document or chunk.", "kind": "concept", "c": "--c-idx", "t": 4337}, {"id": "n227", "zh": "高层问题", "en": "High-level questions", "sum": "These need information pulled together from many chunks or documents.", "kind": "concept", "c": "--c-idx", "t": 4349}, {"id": "n228", "zh": "kNN 的 k 限制", "en": "kNN k-limit problem", "sum": "With k set to, say, 3, a question that needs five or six chunks cannot get them all.", "kind": "tradeoff", "c": "--c-idx", "t": 4364}]}, {"id": "n229", "zh": "递归建树", "en": "Recursive tree construction", "sum": "Starting from the raw docs, it repeatedly clusters similar items and summarizes each cluster, building a hierarchy of summaries.", "kind": "concept", "c": "--c-idx", "t": 4396, "children": [{"id": "n230", "zh": "叶子：原始文档/块", "en": "Leaves: raw docs or chunks", "sum": "The leaves are the rawest form of the information, either chunks or whole documents.", "kind": "step", "c": "--c-idx", "t": 4405}, {"id": "n231", "zh": "聚类相似项", "en": "Cluster similar items", "sum": "Leaves that are semantically similar are grouped into clusters.", "kind": "step", "c": "--c-idx", "t": 4410}, {"id": "n232", "zh": "逐簇摘要", "en": "Summarize each cluster", "sum": "Each cluster's content is condensed into one summary that pulls together information from its members.", "kind": "step", "c": "--c-idx", "t": 4413}, {"id": "n233", "zh": "递归至上限或单簇", "en": "Repeat until limit or root", "sum": "Clustering and summarizing repeat on the summaries until a level limit is hit or one top-level cluster is left.", "kind": "step", "c": "--c-idx", "t": 4433}, {"id": "n234", "zh": "所有层合并索引", "en": "Collapse all levels into index", "sum": "Leaves and summaries from every level go into one pool and are indexed together.", "kind": "step", "c": "--c-idx", "t": 4443}]}, {"id": "n235", "zh": "跨抽象层级覆盖", "en": "Coverage across abstraction levels", "sum": "High-level questions match summary nodes and low-level questions match raw chunks, giving better semantic coverage.", "kind": "concept", "c": "--c-idx", "t": 4480}, {"id": "n236", "zh": "RAPTOR 论文与详解视频", "en": "RAPTOR paper and deep dive", "sum": "The paper's studies show the approach works well; he links the paper and his own longer deep-dive video.", "kind": "paper", "c": "--c-idx", "t": 4501}, {"id": "n237", "zh": "LCEL 文档演示", "en": "Demo on LCEL docs", "sum": "He applies RAPTOR to the LangChain Expression Language docs and gives a high-level code walkthrough.", "kind": "demo", "c": "--c-idx", "t": 4512, "children": [{"id": "n238", "zh": "约30篇+token直方图", "en": "~30 docs, token histogram", "sum": "About 30 docs are loaded; a histogram shows most are under 4,000 tokens and a few are large.", "kind": "demo", "c": "--c-idx", "t": 4543}, {"id": "n239", "zh": "整篇不切分", "en": "Whole docs, no splitting", "sum": "Each document is embedded and clustered whole, without being split first.", "kind": "step", "c": "--c-idx", "t": 4565}, {"id": "n240", "zh": "Claude 与 OpenAI", "en": "Claude and OpenAI models", "sum": "The demo uses both Claude and OpenAI models.", "kind": "demo", "c": "--c-idx", "t": 4605}, {"id": "n241", "zh": "流水线代码块", "en": "Pipeline code blocks", "sum": "The code embeds, clusters, formats text, summarizes clusters, and recursively builds the tree.", "kind": "code", "c": "--c-idx", "t": 4608, "children": [{"id": "n242", "zh": "聚类沿用论文代码", "en": "Clustering from paper code", "sum": "The clustering method largely reuses the paper authors' code, with credit; he leaves the details for viewers to explore.", "kind": "code", "c": "--c-idx", "t": 4610}, {"id": "n243", "zh": "嵌入阶段", "en": "Embedding stage", "sum": "The documents are embedded before clustering.", "kind": "code", "c": "--c-idx", "t": 4628}, {"id": "n244", "zh": "簇摘要", "en": "Cluster summarization", "sum": "Cluster text is formatted and an LLM summarizes each cluster.", "kind": "code", "c": "--c-idx", "t": 4639}, {"id": "n245", "zh": "递归建树，3层", "en": "Recursive tree build, 3 levels", "sum": "The embed-cluster-summarize step is run recursively over the raw doc texts, with roughly three levels of recursion.", "kind": "code", "c": "--c-idx", "t": 4644}]}, {"id": "n246", "zh": "叶文本+摘要共同索引", "en": "Leaf texts plus summaries indexed", "sum": "All summaries are appended to the raw leaf texts, the combined list is indexed together, and a RAG chain runs on it.", "kind": "code", "c": "--c-idx", "t": 4687}]}, {"id": "n247", "zh": "适配长上下文", "en": "Pairs well with long context", "sum": "He argues LLMs with 100K to 1M token windows let RAPTOR work over large documents without splitting.", "kind": "opinion", "c": "--c-idx", "t": 4704}], "chapter": true}, {"id": "n248", "zh": "ColBERT 词元级检索", "en": "ColBERT Token-Level Retrieval", "sum": "Part 14: embed every token instead of one vector per document, and score documents by token-level max similarity.", "kind": "concept", "c": "--c-idx", "t": 4759, "nb": "rag_from_scratch_12_to_14.ipynb", "children": [{"id": "n249", "zh": "RAG 流程回顾", "en": "Recap of the RAG flow", "sum": "So far: query translation, routing, query construction into DSLs (metadata filters, Cypher, SQL), and several indexing methods.", "kind": "concept", "c": "--c-idx", "t": 4774, "note": "索引部分包括 multi-representation、Greg Kamradt 的 chunking 视频推荐、以及层次索引（RAPTOR）。"}, {"id": "n250", "zh": "单向量压缩问题", "en": "Single-vector compression problem", "sum": "Squeezing all of a document's nuance into one vector for kNN search can be too restrictive.", "kind": "tradeoff", "c": "--c-idx", "t": 4838, "children": [{"id": "n251", "zh": "标准稠密检索", "en": "Standard dense retrieval", "sum": "Question and document are each compressed into one vector, and the k most similar document embeddings are returned.", "kind": "concept", "c": "--c-idx", "t": 4838}]}, {"id": "n252", "zh": "后期交互打分", "en": "Late-interaction scoring", "sum": "ColBERT compares every question token with every document token and adds up the best matches.", "kind": "concept", "c": "--c-idx", "t": 4888, "children": [{"id": "n253", "zh": "文档逐 token 向量", "en": "Per-token document vectors", "sum": "The document is tokenized and each token gets its own embedding, with some positional weighting applied.", "kind": "step", "c": "--c-idx", "t": 4906}, {"id": "n254", "zh": "问题逐 token 向量", "en": "Per-token question vectors", "sum": "The question is tokenized and embedded the same way, one vector per token.", "kind": "step", "c": "--c-idx", "t": 4937}, {"id": "n255", "zh": "每个查询 token 取最大", "en": "Max similarity per query token", "sum": "For each question token, compute similarity to all document tokens and keep the maximum.", "kind": "step", "c": "--c-idx", "t": 4945}, {"id": "n256", "zh": "最大值求和为得分", "en": "Sum of maxima = score", "sum": "The document's final score is the sum of these per-question-token maximum similarities.", "kind": "step", "c": "--c-idx", "t": 4971}]}, {"id": "n257", "zh": "效果强但有延迟顾虑", "en": "Strong results, latency concern", "sum": "It reports very strong performance, but latency and production readiness need checking.", "kind": "tradeoff", "c": "--c-idx", "t": 4983}, {"id": "n258", "zh": "RAGatouille 演示", "en": "RAGatouille demo", "sum": "The RAGatouille library makes ColBERT easy to try: load a pretrained model, index a Wikipedia page, then search.", "kind": "demo", "c": "--c-idx", "t": 5002, "children": [{"id": "n259", "zh": "安装并加载预训练模型", "en": "Install, load pretrained model", "sum": "After a pip install, a pretrained ColBERT model from the hub is loaded, following the library's docs.", "kind": "code", "c": "--c-idx", "t": 5010}, {"id": "n260", "zh": "Mac M2 上运行很快", "en": "Runs fast on Mac M2", "sum": "It loaded quickly on his Mac M2 with 32 GB of RAM.", "kind": "demo", "c": "--c-idx", "t": 5028}, {"id": "n261", "zh": "宫崎骏 Wikipedia 页", "en": "Wikipedia page on Miyazaki", "sum": "The full Wikipedia article on Hayao Miyazaki is fetched as the document to index.", "kind": "demo", "c": "--c-idx", "t": 5036}, {"id": "n262", "zh": "默认参数建索引", "en": "Create index with defaults", "sum": "The index call takes an index name, the collection, and a max document length, all left at the docs' defaults.", "kind": "code", "c": "--c-idx", "t": 5045}, {"id": "n263", "zh": "RAG.search 查询工作室", "en": "RAG.search on studio question", "sum": "Searching 'What animation studio did Miyazaki found?' with a set k returns relevant passages.", "kind": "code", "c": "--c-idx", "t": 5102}, {"id": "n264", "zh": "封装为 LangChain retriever", "en": "Wrap as LangChain retriever", "sum": "It can be wrapped as a LangChain retriever, so it works with other LLMs and components such as rerankers.", "kind": "code", "c": "--c-idx", "t": 5117}]}, {"id": "n265", "zh": "适合长文档探索", "en": "Try it for long documents", "sum": "He finds it promising for long-context embedding but suggests checking its max token and context limits first.", "kind": "opinion", "c": "--c-idx", "t": 5144}], "chapter": true}]}, {"id": "s381", "zh": "主动式 RAG", "en": "Active RAG (LangGraph)", "sum": "Grade retrieved documents and generated answers inside the flow, and loop back to rewrite, re-retrieve, search the web or regenerate.", "kind": "concept", "c": "--c-active", "t": 5192, "children": [{"id": "n267", "zh": "用 LangGraph 实现 CRAG", "en": "CRAG with LangGraph", "sum": "Lance builds Corrective RAG as a LangGraph state machine, where retrieved documents are graded and web search fills in when they fall short.", "kind": "concept", "c": "--c-active", "t": 5192, "note": "本章从基础 RAG 的局限出发，引出 active RAG 和状态机，再把 CRAG 论文简化后落地成图并演示。", "nb": "rag_from_scratch_15_to_18.ipynb", "children": [{"id": "n268", "zh": "基础 RAG 的局限", "en": "Why basic RAG falls short", "sum": "The standard pipeline runs one straight line from question to retrieval to generation, with no decisions along the way.", "kind": "concept", "c": "--c-active", "t": 5200, "children": [{"id": "n269", "zh": "实践中的问题", "en": "Questions arising in practice", "sum": "Real systems must decide when to retrieve, whether retrieved docs are good, whether to drop bad ones, and how to retry with a better question.", "kind": "concept", "c": "--c-active", "t": 5226, "note": "例如：文档不好就丢弃，然后改写问题回头重新检索。"}, {"id": "n270", "zh": "Active RAG（主动式）", "en": "Active RAG", "sum": "An approach where the LLM itself decides when and where to retrieve, based on earlier retrievals or generations.", "kind": "concept", "c": "--c-active", "t": 5249}]}, {"id": "n271", "zh": "LLM 控制层级", "en": "Levels of LLM control", "sum": "He ranks how much decision-making the LLM gets in a RAG app, from a fixed single step up to a state machine.", "kind": "concept", "c": "--c-active", "t": 5263, "children": [{"id": "n272", "zh": "Chain：单步输出", "en": "Chain: single-step output", "sum": "The LLM only produces one step's output, for example generating an answer from the documents it is fed.", "kind": "concept", "c": "--c-active", "t": 5272}, {"id": "n273", "zh": "Router：路由选择", "en": "Router: pick a path", "sum": "The LLM picks where a question goes, such as a vector store or a graph DB, as seen earlier in the course.", "kind": "concept", "c": "--c-active", "t": 5287}, {"id": "n274", "zh": "状态机", "en": "State machine", "sum": "The LLM chooses among several steps, but the developer defines every transition that is allowed.", "kind": "concept", "c": "--c-active", "t": 5304, "note": "作者认为这是比 chain 更新的思路，适合更复杂的逻辑流程。", "children": [{"id": "n275", "zh": "LangGraph 构建状态机", "en": "LangGraph builds state machines", "sum": "LangGraph, newly released at the time, is a clean way to build state machines for RAG and other uses by expressing flows as graphs.", "kind": "concept", "c": "--c-active", "t": 5342}]}]}, {"id": "n276", "zh": "Flow engineering 流程工程", "en": "Flow engineering", "sum": "Work out the whole workflow you want before coding it; he notes the term has been going around on Twitter.", "kind": "concept", "c": "--c-active", "t": 5364, "children": [{"id": "n277", "zh": "先花 10 分钟设计流程", "en": "Ten minutes of flow design", "sum": "He finds that briefly planning the flow pays off, because the rest is easy implementation detail.", "kind": "opinion", "c": "--c-active", "t": 5684}]}, {"id": "n278", "zh": "CRAG 论文", "en": "CRAG paper", "sum": "Corrective RAG is a recent active-RAG method that grades retrieved documents and corrects course when they are poor.", "kind": "paper", "c": "--c-active", "t": 5375, "children": [{"id": "n279", "zh": "检索后逐篇评分", "en": "Retrieve then grade each doc", "sum": "Every retrieved document is graded for relevance against a threshold.", "kind": "step", "c": "--c-active", "t": 5390}, {"id": "n280", "zh": "有相关文档→生成", "en": "Any relevant: generate", "sum": "If at least one document passes the relevance threshold, the pipeline goes straight to answer generation.", "kind": "step", "c": "--c-active", "t": 5399, "children": [{"id": "n281", "zh": "知识精炼（略过）", "en": "Knowledge refinement (skipped)", "sum": "The paper adds a knowledge-refinement stage, but he leaves it out as unnecessary for grasping the basic flow.", "kind": "tradeoff", "c": "--c-active", "t": 5406}]}, {"id": "n282", "zh": "全不相关→Web 搜索", "en": "All ambiguous/incorrect: web search", "sum": "If every document is graded ambiguous or incorrect, the paper pulls context from an external source, web search, and generates from that.", "kind": "step", "c": "--c-active", "t": 5429}]}, {"id": "n283", "zh": "作者的简化版本", "en": "His simplifications", "sum": "His version keeps the paper's core ideas but changes a few details to make the implementation simpler.", "kind": "tradeoff", "c": "--c-active", "t": 5464, "children": [{"id": "n284", "zh": "任一不相关即搜索", "en": "Any irrelevant doc triggers search", "sum": "If even one document is irrelevant, he runs web search to supplement the remaining docs instead of only searching when all fail.", "kind": "tradeoff", "c": "--c-active", "t": 5475}, {"id": "n285", "zh": "Tavily 做 Web 搜索", "en": "Tavily for web search", "sum": "He uses the Tavily search API as the web-search tool, which needs a Tavily API key.", "kind": "code", "c": "--c-active", "t": 5489}, {"id": "n286", "zh": "搜索前改写 query", "en": "Query rewriting before search", "sum": "The question is rewritten first so the web search works better.", "kind": "step", "c": "--c-active", "t": 5492}, {"id": "n287", "zh": "LangSmith key 用于追踪", "en": "LangSmith key for tracing", "sum": "A LangSmith API key is set ahead of time so the runs can be inspected as traces later.", "kind": "code", "c": "--c-active", "t": 5510}]}, {"id": "n288", "zh": "索引三篇博客", "en": "Indexing three blog posts", "sum": "He indexes three blog posts he likes into a Chroma vector store with OpenAI embeddings to serve as the retriever.", "kind": "code", "c": "--c-active", "t": 5519}, {"id": "n289", "zh": "图状态 State", "en": "Graph state", "sum": "State is the central object passed between the graph's nodes, and every node modifies it.", "kind": "code", "c": "--c-active", "t": 5539, "children": [{"id": "n290", "zh": "本质是一个 dict", "en": "Just a dictionary", "sum": "The state is simply a dict whose keys hold whatever the RAG flow needs.", "kind": "concept", "c": "--c-active", "t": 5552}, {"id": "n291", "zh": "字段：question/documents/generation", "en": "Keys: question, documents, generation", "sum": "It holds the question, the retrieved documents and the generated answer, plus a web-search flag added during grading.", "kind": "code", "c": "--c-active", "t": 5557, "note": "评分节点会向 state 写入一个是否执行 web search 的标志值。"}, {"id": "n292", "zh": "改变 state 的才是节点", "en": "Node means a state change", "sum": "A step counts as a node because it modifies the state; grading is a node because it can filter documents out.", "kind": "concept", "c": "--c-active", "t": 5630}]}, {"id": "n293", "zh": "流程与各节点", "en": "Flow walkthrough of nodes", "sum": "Walking through his drawn diagram, each stage adds to or changes the state, and node functions take in state and return it updated.", "kind": "step", "c": "--c-active", "t": 5595, "children": [{"id": "n294", "zh": "retrieve 节点", "en": "retrieve node", "sum": "Pulls the question key from the state dict, runs the retriever, and writes the results back under a documents key.", "kind": "code", "c": "--c-active", "t": 5717}, {"id": "n295", "zh": "grade_documents 节点", "en": "grade_documents node", "sum": "Grades each retrieved document, keeps only the relevant ones, and records whether web search is needed.", "kind": "code", "c": "--c-active", "t": 5775, "children": [{"id": "n296", "zh": "Pydantic 二元评分器", "en": "Pydantic binary grader", "sum": "A Pydantic data model makes the grading chain return a strict yes or no, so the output is deterministic enough for logic.", "kind": "code", "c": "--c-active", "t": 5781}, {"id": "n297", "zh": "search 标志逻辑", "en": "Search flag logic", "sum": "The flag starts at 'no' and switches to 'yes' if any document is graded not relevant; it is then saved to state.", "kind": "code", "c": "--c-active", "t": 5803}]}, {"id": "n298", "zh": "条件边：决定去向", "en": "Conditional edge: decide", "sum": "The graph's one decision function reads the search flag and returns the next node: transform query if yes, otherwise generate.", "kind": "code", "c": "--c-active", "t": 5840}, {"id": "n299", "zh": "transform_query 节点", "en": "transform_query node", "sum": "Rewrites the question into a better query before the web search runs.", "kind": "step", "c": "--c-active", "t": 5665}, {"id": "n300", "zh": "web_search 节点", "en": "web_search node", "sum": "Runs a Tavily search on the rewritten question and appends the results to the documents.", "kind": "step", "c": "--c-active", "t": 5834}, {"id": "n301", "zh": "generate 节点", "en": "generate node", "sum": "Takes the question and documents, chains prompt, LLM and a string output parser, and writes the answer back to state.", "kind": "code", "c": "--c-active", "t": 5736, "note": "即 prompt | llm | StrOutputParser，对文档做少量后处理后调用。"}]}, {"id": "n302", "zh": "组装图", "en": "Assembling the graph", "sum": "He wires the graph to match the diagram he drew, which he describes as flow engineering in practice.", "kind": "code", "c": "--c-active", "t": 5885, "children": [{"id": "n303", "zh": "入口点：retrieve", "en": "Entry point: retrieve", "sum": "Execution starts at the retrieve node.", "kind": "code", "c": "--c-active", "t": 5897}, {"id": "n304", "zh": "边与条件边", "en": "Edges and conditional edge", "sum": "Edges run retrieve to grade, branch conditionally to transform query or generate, then transform query to web search to generate.", "kind": "code", "c": "--c-active", "t": 5899}, {"id": "n305", "zh": "generate → END", "en": "generate to END", "sum": "An edge from generate to the end node finishes the graph, which is then compiled and run.", "kind": "code", "c": "--c-active", "t": 5918}]}, {"id": "n306", "zh": "演示：agent memory 提问", "en": "Demo: agent memory question", "sum": "He runs the graph on 'How does agent memory work?' and prints the output of each node as it goes.", "kind": "demo", "c": "--c-active", "t": 5927, "children": [{"id": "n307", "zh": "检索并评分", "en": "Retrieve then grade", "sum": "After retrieval, the grader marks one document not relevant, and that document is dropped from the set.", "kind": "demo", "c": "--c-active", "t": 5951}, {"id": "n308", "zh": "改写并 Web 搜索", "en": "Rewrite and web search", "sum": "Because one doc failed, the question is reworded slightly and web search adds a new document on memory in AI architectures.", "kind": "demo", "c": "--c-active", "t": 5969}, {"id": "n309", "zh": "最终生成", "en": "Final generation", "sum": "The answer is generated from the filtered blog chunks plus the web result.", "kind": "demo", "c": "--c-active", "t": 6008}]}, {"id": "n310", "zh": "LangSmith trace 检查", "en": "LangSmith trace inspection", "sum": "The run is logged in LangSmith, where each graph node shows up as its own step.", "kind": "demo", "c": "--c-active", "t": 6018, "children": [{"id": "n311", "zh": "逐文档评分结果", "en": "Per-document grader scores", "sum": "You can open each grader call and see that one retrieval was scored not relevant.", "kind": "demo", "c": "--c-active", "t": 6056}, {"id": "n312", "zh": "改写后的问题", "en": "Rewritten question", "sum": "The query became roughly 'How does the memory system in artificial agents function?', a light rephrasing.", "kind": "demo", "c": "--c-active", "t": 6078}, {"id": "n313", "zh": "Tavily 命中 Medium 文章", "en": "Tavily hit a Medium post", "sum": "The single web query returned a Medium blog post, which you can sanity-check in the trace.", "kind": "demo", "c": "--c-active", "t": 6087}, {"id": "n314", "zh": "生成步骤完整 prompt", "en": "Full generate prompt", "sum": "The OpenAI call in the generate step shows the prompt holding both the web result and the relevant blog-post chunks.", "kind": "demo", "c": "--c-active", "t": 6097}]}, {"id": "n315", "zh": "总结与观点", "en": "Takeaways and opinions", "sum": "He sums up why moving from chains to graph-based flows is worth it.", "kind": "opinion", "c": "--c-active", "t": 6146, "children": [{"id": "n316", "zh": "图能清晰表达逻辑", "en": "Graphs encode logic cleanly", "sum": "Graphs let you build richer reasoning workflows in a clean, well-engineered way, with every allowed transition spelled out.", "kind": "opinion", "c": "--c-active", "t": 6160}, {"id": "n317", "zh": "构建很直观", "en": "Intuitive to build", "sum": "He finds designing logical workflows this way very intuitive and encourages viewers to try it.", "kind": "opinion", "c": "--c-active", "t": 6181}, {"id": "n318", "zh": "trace 比 agent 更易读", "en": "Traces easier than agents", "sum": "Each node is listed clearly in the traces, which he says is often not true of more complex approaches such as agents.", "kind": "tradeoff", "c": "--c-active", "t": 6215}, {"id": "n319", "zh": "Self-RAG/CRAG 博客预告", "en": "Upcoming Self-RAG/CRAG blog", "sum": "He mentions a blog post coming out the next day that implements both Self-RAG and CRAG as LangGraph state machines.", "kind": "paper", "c": "--c-active", "t": 6190}]}], "chapter": true}, {"id": "n320", "zh": "Adaptive RAG", "en": "Adaptive RAG: LangGraph + Command R", "sum": "Builds a RAG flow that routes each question to a source and runs self-checks at inference time, using LangGraph and Cohere Command R.", "kind": "concept", "c": "--c-active", "t": 6249, "note": "把查询分析（路由）和推理时的在线检查（相关性、幻觉、答案有用性）结合成一个图。", "children": [{"id": "n321", "zh": "查询分析", "en": "Idea 1: Query analysis", "sum": "The front end of a RAG pipeline: change the input question and send it to the right data source.", "kind": "concept", "c": "--c-active", "t": 6279, "children": [{"id": "n322", "zh": "问题改写", "en": "Rewriting the question", "sum": "Changes the question to improve retrieval, e.g. splitting it into sub-questions or using step-back prompting.", "kind": "concept", "c": "--c-active", "t": 6286}, {"id": "n323", "zh": "路由到数据源", "en": "Routing to a source", "sum": "Picks one of several targets: different vector stores, a relational DB, web search, or a plain LLM fallback.", "kind": "concept", "c": "--c-active", "t": 6301}]}, {"id": "n324", "zh": "流程工程/在线单元测试", "en": "Idea 2: Flow engineering / unit tests", "sum": "Runs checks inside the inference flow, such as document relevance and hallucination tests, and corrects course when a check fails.", "kind": "concept", "c": "--c-active", "t": 6338, "children": [{"id": "n325", "zh": "Hamel Husain 评估博客", "en": "Hamel Husain's eval post", "sum": "Husain suggests putting assertions beyond normal unit tests, including automatic retries during model inference, which Lance calls the key point.", "kind": "opinion", "c": "--c-active", "t": 6353}, {"id": "n326", "zh": "呼应 CRAG/Self-RAG", "en": "Echoes CRAG and Self-RAG", "sum": "Corrective RAG and Self-RAG, covered earlier, use the same kind of in-flow self-correction.", "kind": "paper", "c": "--c-active", "t": 6385}, {"id": "n327", "zh": "纠正检索与生成", "en": "Recover from bad retrieval/generation", "sum": "If retrieval is poor or the answer hallucinates, the flow detects it and tries another path.", "kind": "concept", "c": "--c-active", "t": 6393}]}, {"id": "n328", "zh": "流程草图", "en": "Planned flow diagram", "sum": "Sketch of the target flow: route, retrieve, grade documents, generate, check for hallucination, check the answer, then return.", "kind": "concept", "c": "--c-active", "t": 6403, "children": [{"id": "n329", "zh": "三条路由", "en": "Three routes", "sum": "The question goes to the vector store, to web search, or straight to the LLM as a fallback.", "kind": "step", "c": "--c-active", "t": 6417}, {"id": "n330", "zh": "不相关则转网搜", "en": "Relevance check → web search", "sum": "If retrieved documents are irrelevant to the question, the flow falls back to web search; this matters most after vector store routin
