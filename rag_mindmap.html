g.", "kind": "step", "c": "--c-active", "t": 6437}, {"id": "n331", "zh": "幻觉与答案检查", "en": "Hallucination and answer checks", "sum": "After generation, checks that the answer is grounded in the documents and actually answers the question.", "kind": "step", "c": "--c-active", "t": 6454}]}, {"id": "n332", "zh": "为何选 Command R", "en": "Why Cohere Command R", "sum": "Command R suits this workflow: it supports tool-based routing, is small and fast enough for grading, and is tuned for RAG.", "kind": "tradeoff", "c": "--c-active", "t": 6476, "children": [{"id": "n333", "zh": "工具调用+查询改写", "en": "Tool use + query rewriting", "sum": "It has strong tool-use support and can rewrite queries during tool use, which makes it a good router.", "kind": "concept", "c": "--c-active", "t": 6491}, {"id": "n334", "zh": "35B 开放权重", "en": "35B open weights", "sum": "At 35 billion parameters with open weights, it can run locally, and it is fast when served through the API.", "kind": "concept", "c": "--c-active", "t": 6502}, {"id": "n335", "zh": "针对 RAG 调优", "en": "RAG-tuned, large context", "sum": "It is well tuned for RAG and has a long context window of roughly 128k tokens.", "kind": "concept", "c": "--c-active", "t": 6516, "note": "字幕写作 120,000 tokens；Command R 官方为 128k。"}]}, {"id": "n336", "zh": "环境与向量库", "en": "Setup and vector store", "sum": "Installs langchain-cohere, sets the Cohere key, traces to a LangSmith project, and builds a Chroma index.", "kind": "code", "c": "--c-active", "t": 6545, "children": [{"id": "n337", "zh": "LangSmith 追踪", "en": "LangSmith tracing project", "sum": "Sets a LangChain project name and turns on tracing so every run is logged in LangSmith.", "kind": "code", "c": "--c-active", "t": 6556}, {"id": "n338", "zh": "Chroma+Cohere 嵌入", "en": "Chroma + Cohere embeddings", "sum": "Indexes three blog posts (agents, prompt engineering, adversarial attacks) in a local Chroma store using Cohere embeddings.", "kind": "code", "c": "--c-active", "t": 6570}, {"id": "n339", "zh": "检索器测试", "en": "Retriever smoke test", "sum": "Calls retriever.invoke with a question about agent memory and gets documents back.", "kind": "demo", "c": "--c-active", "t": 6583}]}, {"id": "n340", "zh": "工具路由器", "en": "Router with tools", "sum": "Defines two tools and a preamble, then binds them to Command R to get a structured LLM router.", "kind": "code", "c": "--c-active", "t": 6601, "children": [{"id": "n341", "zh": "两个工具", "en": "web_search and vectorstore tools", "sum": "The router can pick either a web search tool or a vector store tool.", "kind": "code", "c": "--c-active", "t": 6610}, {"id": "n342", "zh": "Preamble 写明主题", "en": "Preamble lists index topics", "sum": "The key trick is telling the model what the vector store covers, so it uses the store for those topics and web search for everything else.", "kind": "opinion", "c": "--c-active", "t": 6617}, {"id": "n343", "zh": "路由测试", "en": "Router test questions", "sum": "Three test questions show each routing outcome.", "kind": "demo", "c": "--c-active", "t": 6651, "children": [{"id": "n344", "zh": "NFL 选秀→网搜", "en": "Bears NFL draft → web", "sum": "A current-events question about the Bears' draft goes to web search.", "kind": "demo", "c": "--c-active", "t": 6661}, {"id": "n345", "zh": "智能体记忆→向量库", "en": "Agent memory → vector store", "sum": "A question about types of agent memory goes to the vector store.", "kind": "demo", "c": "--c-active", "t": 6673}, {"id": "n346", "zh": "闲聊→无工具", "en": "'Hi how are you' → false", "sum": "A greeting calls no tool, so the result is false; later this signal triggers the LLM fallback.", "kind": "demo", "c": "--c-active", "t": 6674}]}]}, {"id": "n347", "zh": "结构化输出评分器", "en": "Graders via structured output", "sum": "Each grader uses with_structured_output and a Pydantic model so the LLM returns only a yes/no binary score.", "kind": "code", "c": "--c-active", "t": 6695, "children": [{"id": "n348", "zh": "GradeDocuments 模型", "en": "GradeDocuments Pydantic model", "sum": "A Pydantic schema with one binary_score field, yes or no, for whether the documents are relevant.", "kind": "code", "c": "--c-active", "t": 6708}, {"id": "n349", "zh": "为何限定 yes/no", "en": "Why constrain to yes/no", "sum": "The graph's conditional edges need a clean binary answer with no preamble, so the output is constrained to the schema.", "kind": "opinion", "c": "--c-active", "t": 6756, "note": "他认为这种结构化输出技巧对很多问题都普遍有用。"}, {"id": "n350", "zh": "内部机制", "en": "Under the hood", "sum": "The Pydantic object becomes a Cohere function schema bound to the LLM, which returns JSON that is parsed back into a Pydantic object.", "kind": "concept", "c": "--c-active", "t": 6797}, {"id": "n351", "zh": "检索评分测试", "en": "Retrieval grader test", "sum": "Grading a retrieved document for 'types of agent memory' returns relevant, as expected.", "kind": "demo", "c": "--c-active", "t": 6776}, {"id": "n352", "zh": "幻觉评分器", "en": "Hallucination grader", "sum": "Same yes/no structure with a different prompt: is the answer grounded in the facts?", "kind": "code", "c": "--c-active", "t": 6919}, {"id": "n353", "zh": "答案评分器", "en": "Answer grader", "sum": "A third binary grader checks whether the answer addresses the question; each grader was tested on its own.", "kind": "code", "c": "--c-active", "t": 6926}]}, {"id": "n354", "zh": "生成/兜底/搜索", "en": "Generation, fallback, search", "sum": "The remaining pieces: a standard RAG chain, an LLM fallback chain, and a web search tool.", "kind": "code", "c": "--c-active", "t": 6846, "children": [{"id": "n355", "zh": "RAG 链", "en": "RAG chain with Cohere", "sum": "A standard RAG prompt and chain running on Cohere; it works without any trouble.", "kind": "code", "c": "--c-active", "t": 6847}, {"id": "n356", "zh": "LLM 兜底链", "en": "LLM fallback chain", "sum": "Used when the router calls no tool; its preamble tells the model to answer from its own internal knowledge.", "kind": "code", "c": "--c-active", "t": 6864}, {"id": "n357", "zh": "网搜工具", "en": "Web search tool", "sum": "A search tool used by the web search node.", "kind": "code", "c": "--c-active", "t": 6943}]}, {"id": "n358", "zh": "构建 LangGraph", "en": "Assembling the LangGraph", "sum": "Joins the tested pieces into a graph where circles are node functions and diamonds are conditional edge functions.", "kind": "step", "c": "--c-active", "t": 6962, "children": [{"id": "n359", "zh": "图状态", "en": "Graph state", "sum": "The state passed through the graph holds the question, the generation, and the documents.", "kind": "code", "c": "--c-active", "t": 6987}, {"id": "n360", "zh": "节点即函数", "en": "Nodes as functions", "sum": "The nodes are retrieve, llm_fallback, generate, grade_documents, and web_search, and each is a plain function.", "kind": "code", "c": "--c-active", "t": 7058}, {"id": "n361", "zh": "条件边", "en": "Conditional edges", "sum": "Functions that decide what happens next by returning the name of the next node.", "kind": "concept", "c": "--c-active", "t": 7082, "children": [{"id": "n362", "zh": "route_question", "en": "route_question", "sum": "With no tool_calls it goes to the fallback; otherwise it reads the tool name and returns web_search or vectorstore.", "kind": "code", "c": "--c-active", "t": 7089}, {"id": "n363", "zh": "decide_to_generate", "en": "decide_to_generate", "sum": "If grading filtered out every document, it goes to web search; otherwise it goes to generate.", "kind": "code", "c": "--c-active", "t": 7182}, {"id": "n364", "zh": "幻觉+有用性检查", "en": "Grounded + useful check", "sum": "Hallucinated answers are regenerated; grounded but unhelpful answers go to web search; grounded, helpful answers end the run.", "kind": "code", "c": "--c-active", "t": 7223, "note": "注意 hallucination grader 中 'yes' 表示答案有依据，而非存在幻觉。"}]}, {"id": "n365", "zh": "连线", "en": "Wiring the flow", "sum": "The router is the entry point; web_search leads to generate, retrieve leads to grade_documents, and the fallback leads to END.", "kind": "code", "c": "--c-active", "t": 7269}, {"id": "n366", "zh": "先画图再实现", "en": "Draw diagram first", "sum": "His habit is to sketch the graph first, then write each node and edge as a function and join them, so the code matches the diagram.", "kind": "opinion", "c": "--c-active", "t": 7293}]}, {"id": "n367", "zh": "演示运行", "en": "Demo runs", "sum": "Three test questions run through the compiled graph, then the traces and timings are checked in LangSmith.", "kind": "demo", "c": "--c-active", "t": 7447, "children": [{"id": "n368", "zh": "Bears 选秀问题", "en": "Bears draft question", "sum": "It routes to web search, generates, passes both checks, and answers that the Bears are expected to pick Caleb Williams.", "kind": "demo", "c": "--c-active", "t": 7450}, {"id": "n369", "zh": "智能体记忆问题", "en": "Agent memory question", "sum": "It routes to the vector store and grades all documents relevant very quickly; the answer reflects the blog post.", "kind": "demo", "c": "--c-active", "t": 7490}, {"id": "n370", "zh": "LangSmith 审计", "en": "Auditing in LangSmith", "sum": "The LangSmith trace shows every graph stage, so each document grade, hallucination grade, and answer grade can be checked.", "kind": "demo", "c": "--c-active", "t": 7525}, {"id": "n371", "zh": "问候→兜底", "en": "Greeting → fallback", "sum": "An unrelated greeting takes the fallback path and gets a direct LLM reply.", "kind": "demo", "c": "--c-active", "t": 7585}, {"id": "n372", "zh": "耗时", "en": "Latency", "sum": "A full run took about 7 seconds (about 6 in the graph) and the fallback about 1 second, which he calls fast.", "kind": "demo", "c": "--c-active", "t": 7608}]}, {"id": "n373", "zh": "展望：内联检查", "en": "Outlook: inline checking", "sum": "He expects adaptive or self-reflective RAG to spread, because many production RAG systems lack fallbacks and checks keep getting cheaper.", "kind": "opinion", "c": "--c-active", "t": 7663}, {"id": "n374", "zh": "LangGraph vs 智能体", "en": "LangGraph vs agents", "sum": "Pick LangGraph for known, reliable flows with small models, and agents for open-ended reasoning with larger models.", "kind": "tradeoff", "c": "--c-active", "t": 7702, "children": [{"id": "n375", "zh": "LangGraph：可靠受限", "en": "LangGraph: constrained, reliable", "sum": "Best when the steps are known in advance; it is like putting an agent on guardrails: less flexible but very reliable.", "kind": "tradeoff", "c": "--c-active", "t": 7713}, {"id": "n376", "zh": "可用小模型", "en": "Works with small fast models", "sum": "Because the flow is constrained, a 35B Command R handled it well, and the flow was built in about 15 minutes.", "kind": "opinion", "c": "--c-active", "t": 7747}, {"id": "n377", "zh": "智能体：灵活欠稳", "en": "Agents: flexible, less reliable", "sum": "Agents can make open-ended decisions, which suits long-horizon planning, but they are less reliable and usually need larger LLMs.", "kind": "tradeoff", "c": "--c-active", "t": 7768}, {"id": "n378", "zh": "开源小模型可复现", "en": "Small open models run reproducibly", "sum": "He has run such graphs reproducibly on his laptop with open models like Mistral and Command R.", "kind": "opinion", "c": "--c-active", "t": 7803}, {"id": "n379", "zh": "Command R+ 用于智能体", "en": "Command R+ for agents", "sum": "The larger Command R+ is coming and may suit open-ended agent use; LangChain has a new Cohere agents integration.", "kind": "concept", "c": "--c-active", "t": 7820}]}, {"id": "n380", "zh": "本地运行 Command R", "en": "Running Command R locally", "sum": "Command R runs locally through Ollama, but the 2-bit quantized model is about 13 GB and RAG calls take about 30 seconds on his Mac.", "kind": "tradeoff", "c": "--c-active", "t": 7863, "note": "他的机器是 Mac M2 32GB，跑现场演示太慢；更大内存的机器值得尝试本地运行。"}], "chapter": true}]}, {"id": "n382", "zh": "RAG 的未来", "en": "The future of RAG", "sum": "A recorded meetup talk asking whether million-token context windows make retrieval obsolete, and how RAG will evolve instead.", "kind": "concept", "c": "--c-future", "t": 7922, "note": "Lance 在旧金山 meetup 上的演讲《RAG 真的死了吗？》的录制版。", "nb": "rag_from_scratch_15_to_18.ipynb", "children": [{"id": "n383", "zh": "上下文窗口持续增长", "en": "Context windows keep growing", "sum": "LLM context windows went from a few thousand tokens to millions within about a year.", "kind": "concept", "c": "--c-future", "t": 7944, "children": [{"id": "n384", "zh": "预训练 token 规模", "en": "Pre-training token scale", "sum": "Proprietary models are trained on trillions of tokens, small models like Phi-2 on far fewer.", "kind": "concept", "c": "--c-future", "t": 7949, "note": "图的 x 轴是预训练 token 数，闭源模型大约在两万亿以上。"}, {"id": "n385", "zh": "窗口大小时间线", "en": "Timeline of context sizes", "sum": "About 4k–8k tokens a year earlier, then Claude 2 at 200k, GPT-4 at 128k, and Claude 3 and Gemini at 1M.", "kind": "concept", "c": "--c-future", "t": 7969, "note": "从几十页到几百页，再到成百上千页的文本量。"}, {"id": "n386", "zh": "RAG 已死？", "en": "Is RAG dead?", "sum": "If thousands of pages fit in the prompt, people ask why a separate retrieval system is still needed.", "kind": "opinion", "c": "--c-future", "t": 7996, "note": "这个问题在 Twitter 上引起了很多讨论。"}]}, {"id": "n387", "zh": "测试用的 RAG 定义", "en": "RAG definition for the test", "sum": "RAG means reasoning over retrieved chunks, usually from several documents, to ground the answer.", "kind": "concept", "c": "--c-future", "t": 8015, "children": [{"id": "n388", "zh": "索引-检索-推理", "en": "Index, retrieve, then reason", "sum": "Documents are indexed, fetched via semantic or keyword search, and passed to an LLM that grounds its answer in them.", "kind": "step", "c": "--c-future", "t": 8022}, {"id": "n389", "zh": "能否替代的判据", "en": "Replacement criterion", "sum": "To replace RAG, a long-context LLM must retrieve and reason over several facts in its own context.", "kind": "concept", "c": "--c-future", "t": 8046, "note": "关键点：真实 RAG 通常涉及多个文档和推理，而不只是找一个事实。"}]}, {"id": "n390", "zh": "多针大海捞针实验", "en": "Multi-needle experiment", "sum": "An extension of needle-in-a-haystack tests that hides several facts and checks whether the model recovers all of them.", "kind": "demo", "c": "--c-future", "t": 8059, "note": "与 Greg Kamradt 合作，测试框架开源。", "children": [{"id": "n391", "zh": "前期工作", "en": "Prior work it builds on", "sum": "Greg Kamradt's single-fact needle tests in Paul Graham essays, and Anthropic's pizza-ingredient needle challenge.", "kind": "paper", "c": "--c-future", "t": 8061}, {"id": "n392", "zh": "实验设置", "en": "Test setup", "sum": "The pizza answer is split into three needles hidden at different depths in the haystack.", "kind": "step", "c": "--c-future", "t": 8096, "children": [{"id": "n393", "zh": "问题与针", "en": "Question and needles", "sum": "The question asks for the secret ingredients of a perfect pizza; needles are figs, prosciutto and goat cheese.", "kind": "step", "c": "--c-future", "t": 8112}, {"id": "n394", "zh": "针的放置规则", "en": "Needle placement rule", "sum": "You choose the depth percentage of the first needle; the rest are spread evenly through the remaining context.", "kind": "step", "c": "--c-future", "t": 8123}, {"id": "n395", "zh": "自动评分", "en": "Automatic grading", "sum": "The framework checks whether every ingredient appears in the answer and, if not, which ones are missing.", "kind": "step", "c": "--c-future", "t": 8148}]}, {"id": "n396", "zh": "GPT-4 测试条件", "en": "GPT-4 test conditions", "sum": "GPT-4 was tested with 1, 3 or 10 needles, contexts from 1k up to 120k tokens, and nine repeated trials.", "kind": "demo", "c": "--c-future", "t": 8163, "children": [{"id": "n397", "zh": "检索模式 vs 推理模式", "en": "Retrieval vs reasoning mode", "sum": "Plain mode just returns the ingredients; reasoning mode must also give each ingredient's first letter.", "kind": "step", "c": "--c-future", "t": 8184}]}]}, {"id": "n398", "zh": "实验发现", "en": "Experiment findings", "sum": "Three consistent patterns show that long-context recall is unreliable for RAG-style tasks.", "kind": "concept", "c": "--c-future", "t": 8197, "children": [{"id": "n399", "zh": "针越多越差", "en": "More needles, lower recall", "sum": "The share of needles found falls as their number rises; with 10 needles, recall was about 60%.", "kind": "concept", "c": "--c-future", "t": 8199}, {"id": "n400", "zh": "推理比检索难", "en": "Reasoning harder than retrieval", "sum": "Asking for the first letters on top of retrieval lowered scores compared with plain retrieval.", "kind": "concept", "c": "--c-future", "t": 8210}, {"id": "n401", "zh": "上下文越长越差", "en": "Longer context, more misses", "sum": "At 1k tokens every needle was found; failures grew as context length rose toward 120k.", "kind": "concept", "c": "--c-future", "t": 8281}, {"id": "n402", "zh": "前部的针易遗忘", "en": "Early needles get forgotten", "sum": "Needles placed near the start were missed more than those near the end, much like forgetting a book's first chapter.", "kind": "concept", "c": "--c-future", "t": 8288, "note": "Greg 在单针测试中也反复看到了这一现象。", "children": [{"id": "n403", "zh": "近因偏差解释", "en": "Recency bias explanation", "sum": "A paper shared on Twitter suggests models attend more to recent tokens, since those best predict the next token.", "kind": "paper", "c": "--c-future", "t": 8343}]}]}, {"id": "n404", "zh": "对长上下文的警示", "en": "Caveats on long-context claims", "sum": "Stuffing the context gives no retrieval guarantee, and many published needle results may overstate real-world performance.", "kind": "tradeoff", "c": "--c-future", "t": 8385, "children": [{"id": "n405", "zh": "单针过于简单", "en": "Single needle is too easy", "sum": "Retrieving one fact with no reasoning is easier than the multi-fact retrieval real RAG needs.", "kind": "tradeoff", "c": "--c-future", "t": 8392}, {"id": "n406", "zh": "针与背景差异大", "en": "Needle stands out from haystack", "sum": "Needles differ sharply from Paul Graham essays; others found that subtler needles are retrieved worse.", "kind": "tradeoff", "c": "--c-future", "t": 8406}, {"id": "n407", "zh": "警惕厂商测评", "en": "Be skeptical of vendor charts", "sum": "Strong needle-in-a-haystack charts from model providers don't guarantee good retrieval from long-context LLMs.", "kind": "opinion", "c": "--c-future", "t": 8431}]}, {"id": "n408", "zh": "RAG 不死但会变", "en": "RAG will change, not die", "sum": "Long context will improve, but RAG will evolve rather than vanish, as in Zappa's quip that jazz just smells funny.", "kind": "opinion", "c": "--c-future", "t": 8472}, {"id": "n409", "zh": "精确分块 vs 塞满上下文", "en": "Precise chunks vs context stuffing", "sum": "Both extremes have costs, so the best option is likely a Pareto-optimal middle ground.", "kind": "tradeoff", "c": "--c-future", "t": 8492, "children": [{"id": "n410", "zh": "当前分块式流程", "en": "Today's chunk-centric pipeline", "sum": "Chunk documents, embed and index them, run kNN for top-k chunks, filter them, then ground the answer.", "kind": "step", "c": "--c-future", "t": 8495, "note": "chunk size、k 等参数往往是几乎随意选的。"}, {"id": "n411", "zh": "精确分块的缺点", "en": "Downsides of precise chunking", "sum": "Risks over-engineering, sensitivity to chunk size and k, lower recall, and dependence on specific embedding models.", "kind": "tradeoff", "c": "--c-future", "t": 8542}, {"id": "n412", "zh": "全部塞入的缺点", "en": "Downsides of stuffing everything", "sum": "Brings higher latency and token cost, no way to audit retrieval, and harder per-user security and access control.", "kind": "tradeoff", "c": "--c-future", "t": 8574, "note": "100k token 的 GPT-4 调用大约每次 1 美元，多针实验花了不少钱。"}, {"id": "n413", "zh": "文档级折中", "en": "Document-level middle ground", "sum": "Retrieving whole documents, which are self-contained units of context, looks like a sensible middle ground.", "kind": "opinion", "c": "--c-future", "t": 8613}]}, {"id": "n414", "zh": "仍然重要的部分", "en": "What stays relevant", "sum": "Routing, document-centric indexing and reasoning loops remain useful even with long-context LLMs.", "kind": "concept", "c": "--c-future", "t": 8631, "children": [{"id": "n415", "zh": "以文档为中心的 RAG", "en": "Document-centric RAG", "sum": "Skip chunking and work with full documents, while still routing each question to the right document.", "kind": "concept", "c": "--c-future", "t": 8631}, {"id": "n416", "zh": "查询分析", "en": "Query analysis", "sum": "Methods that transform or direct the question before retrieval still apply in the long-context era.", "kind": "concept", "c": "--c-future", "t": 8647, "children": [{"id": "n417", "zh": "查询改写", "en": "Query rewriting", "sum": "Rephrase the input question to improve retrieval.", "kind": "step", "c": "--c-future", "t": 8654}, {"id": "n418", "zh": "路由到数据源", "en": "Routing to data stores", "sum": "Send the question to the right store: a relational database, a graph database or a vector store.", "kind": "step", "c": "--c-future", "t": 8658}, {"id": "n419", "zh": "查询构建", "en": "Query construction", "sum": "Turn text into SQL, Cypher or vector-store metadata filters; nobody will dump a whole SQL database into the prompt.", "kind": "step", "c": "--c-future", "t": 8665}]}, {"id": "n420", "zh": "文档级索引方法", "en": "Document-centric indexing", "sum": "Indexing tricks that retrieve full documents without having to tune chunk size.", "kind": "concept", "c": "--c-future", "t": 8710, "children": [{"id": "n421", "zh": "多表示索引", "en": "Multi-representation indexing", "sum": "Index a summary of each document, match the question against summaries, then hand the full document to the LLM.", "kind": "concept", "c": "--c-future", "t": 8716, "note": "相关论文：Dense X Retrieval（命题索引）。找到正确文档比找到正确块更容易。", "children": [{"id": "n422", "zh": "父文档检索器", "en": "Parent document retriever", "sum": "A variant that searches over small chunks but returns the full parent document.", "kind": "concept", "c": "--c-future", "t": 8768}]}, {"id": "n423", "zh": "RAPTOR 层级索引", "en": "RAPTOR hierarchical indexing", "sum": "Embed and cluster documents, summarize each cluster recursively up to one root summary, and index every level.", "kind": "paper", "c": "--c-future", "t": 8787, "note": "斯坦福的论文，适合需要跨多文档整合信息的问题。论文的叶节点是块，Lance 演示了也可用于完整文档。"}, {"id": "n424", "zh": "长上下文 embedding", "en": "Long-context embeddings", "sum": "Embedding whole documents needs long-context embedders, such as Hazy Research's 32k-token Monarch Mixer model on Together AI.", "kind": "concept", "c": "--c-future", "t": 8853}]}, {"id": "n425", "zh": "循环式 RAG 流程", "en": "Cyclic RAG flows", "sum": "Move from single-shot RAG to loops that grade retrieval and generation and correct mistakes.", "kind": "concept", "c": "--c-future", "t": 8903, "children": [{"id": "n426", "zh": "Self-RAG", "en": "Self-RAG", "sum": "Grade document relevance and rewrite the question to retry if needed, then check answers for hallucination and relevance.", "kind": "paper", "c": "--c-future", "t": 8926, "note": "用 LangGraph 实现了，效果很好。"}, {"id": "n427", "zh": "CRAG 网络搜索兜底", "en": "CRAG web-search fallback", "sum": "Corrective RAG grades retrieved documents and falls back to web search when the question is outside the index.", "kind": "paper", "c": "--c-future", "t": 9041, "note": "在本地笔记本上通过 Ollama 用 Mistral 7B 运行也效果不错。"}, {"id": "n428", "zh": "降低延迟", "en": "Latency mitigations", "sum": "Use very fast models such as Groq or GPT-3.5 Turbo for the easy grading steps, and cap the loop at one iteration.", "kind": "tradeoff", "c": "--c-future", "t": 8984}]}, {"id": "n429", "zh": "整体图景", "en": "Overall picture", "sum": "Future RAG reasons before and after retrieval in cyclic flows over full documents, as code generation already does.", "kind": "opinion", "c": "--c-future", "t": 9105}]}], "chapter": true}]}, "chapters": [{"t": 0, "id": "n1"}, {"t": 353, "id": "n25"}, {"t": 640, "id": "n41"}, {"t": 952, "id": "n54"}, {"t": 1334, "id": "n74"}, {"t": 1700, "id": "n96"}, {"t": 2037, "id": "n109"}, {"t": 2431, "id": "n127"}, {"t": 2844, "id": "n142"}, {"t": 3127, "id": "n157"}, {"t": 3548, "id": "n178"}, {"t": 3905, "id": "n200"}, {"t": 4299, "id": "n223"}, {"t": 4759, "id": "n248"}, {"t": 5192, "id": "n267"}, {"t": 6249, "id": "n320"}, {"t": 7922, "id": "n382"}], "total": 9191, "footer": "共 430 个节点,最深 7 层。内容依据视频英文自动字幕整理:先逐段修正识别错误(见仓库 notes/asr_corrections.md),再用中英文转述,非原话。时间戳为该概念在视频中出现的大致位置。"};
const VID = 'https://www.youtube.com/watch?v=sVcwVQRHIc8';
const REPO = 'https://github.com/langchain-ai/rag-from-scratch/blob/main/';
const KIND = {
  concept: ['', '概念'], step: ['#', '步骤'], demo: ['▶', '演示'], code: ['{}', '代码'],
  tradeoff: ['⇄', '权衡'], opinion: ['★', '他的观点'], paper: ['¶', '论文'],
};
const ROW = 30, H = 24, GAP = 30, MAXW = 236;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const fmt = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p = v => String(v).padStart(2, '0'); return h ? `${h}:${p(m)}:${p(x)}` : `${m}:${p(x)}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- hierarchy
const root = d3.hierarchy(DATA.root);
const all = root.descendants();
const byId = new Map(all.map(d => [d.data.id, d]));
all.forEach(d => { d._children = d.children || null; });
const countAll = d => (d._children || []).reduce((n, c) => n + 1 + countAll(c), 0);
const stepNo = d => { if (d.data.kind !== 'step' || !d.parent) return 0; return d.parent._children.filter(c => c.data.kind === 'step').indexOf(d) + 1; };

// ---- measuring
const ctx = document.createElement('canvas').getContext('2d');
const fontFor = d => d.depth === 0 ? '700 16px "Bricolage Grotesque", sans-serif' : d.depth === 1 ? '700 14px "Noto Sans SC", sans-serif' : d.depth === 2 ? '500 13px "Noto Sans SC", sans-serif' : '400 13px "Noto Sans SC", sans-serif';
const glyphOf = d => { const k = d.data.kind; if (k === 'step') return String(stepNo(d)); return (KIND[k] || KIND.concept)[0]; };
function measure(d) {
  ctx.font = fontFor(d);
  let text = d.data.zh, w = ctx.measureText(text).width;
  if (w > MAXW) { while (text.length > 2 && ctx.measureText(text + '…').width > MAXW) text = text.slice(0, -1); text += '…'; w = ctx.measureText(text).width; }
  ctx.font = '500 11px "JetBrains Mono", monospace';
  const g = glyphOf(d), gw = g ? ctx.measureText(g).width + 6 : 0;
  d.label = text; d.gw = gw; d.w = Math.ceil(12 + gw + w + 12 + (d._children ? 22 : 0));
}

// ---- state
let sel = null, hits = new Set(), level = 3;
function setLevel(k) { level = k; all.forEach(d => { if (d._children) d.children = d.depth < k - 1 ? d._children : null; }); document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('on', +b.dataset.l === k)); }
function reveal(d) { for (let a = d.parent; a; a = a.parent) if (a._children) a.children = a._children; }

// ---- layout
function layout() {
  const vis = root.descendants();
  vis.forEach(measure);
  d3.tree().nodeSize([ROW, 1]).separation((a, b) => a.parent === b.parent ? 1 : 1.35)(root);
  const colW = [];
  vis.forEach(d => { colW[d.depth] = Math.max(colW[d.depth] || 0, d.w); });
  const colX = [0];
  for (let i = 1; i < colW.length; i++) colX[i] = colX[i - 1] + colW[i - 1] + GAP + (i < 3 ? 14 : 0);
  vis.forEach(d => { d.px = colX[d.depth]; d.py = d.x; });
  return vis;
}

// ---- render
const svg = d3.select('#svg'), gAll = d3.select('#all'), gLinks = d3.select('#links'), gNodes = d3.select('#nodes');
const stage = document.getElementById('stage'), tip = document.getElementById('tip');
const zoom = d3.zoom().scaleExtent([0.2, 2.2])
  .filter(ev => ev.type === 'wheel' ? (ev.ctrlKey || ev.metaKey) : !ev.button)
  .on('zoom', ev => gAll.attr('transform', ev.transform));
svg.call(zoom).on('dblclick.zoom', null);
svg.on('wheel.pan', ev => {
  if (ev.ctrlKey || ev.metaKey) return;
  ev.preventDefault();
  const k = d3.zoomTransform(svg.node()).k;
  zoom.translateBy(svg, -ev.deltaX / k, -ev.deltaY / k);
}, { passive: false });

function render() {
  const vis = layout();
  const onPath = new Set(); if (sel) for (let a = sel; a; a = a.parent) onPath.add(a);
  gLinks.selectAll('path').data(root.links(), l => l.target.data.id).join('path')
    .attr('class', l => 'link' + (onPath.has(l.target) ? ' on' : ''))
    .attr('style', l => `stroke:var(${l.target.data.c})`)
    .attr('d', l => { const s = l.source, t = l.target, x1 = s.px + s.w, y1 = s.py, x2 = t.px, y2 = t.py, m = (x2 - x1) / 2; return `M${x1},${y1}C${x1 + m},${y1} ${x2 - m},${y2} ${x2},${y2}`; });
  const g = gNodes.selectAll('g.n').data(vis, d => d.data.id).join(enter => {
    const g = enter.append('g');
    g.append('rect').attr('class', 'box');
    const t = g.append('text').attr('class', 'lbl');
    t.append('tspan').attr('class', 'glyph');
    t.append('tspan').attr('class', 'txt');
    const tg = g.append('g').attr('class', 'tog');
    tg.append('circle').attr('r', 8.5);
    tg.append('text').attr('dy', '0.35em');
    g.on('click', (ev, d) => { select(d, { expand: true }); });
    tg.on('click', (ev, d) => { ev.stopPropagation(); toggle(d); });
    g.on('pointerenter', (ev, d) => showTip(ev, d)).on('pointermove', moveTip).on('pointerleave', hideTip);
    return g;
  });
  g.attr('class', d => `n d${Math.min(d.depth, 3)}` + (d === sel ? ' sel' : '') + (hits.has(d) ? ' hit' : ''))
    .attr('style', d => `--c:var(${d.data.c})`)
    .attr('transform', d => `translate(${d.px},${d.py - H / 2})`);
  g.select('rect').attr('width', d => d.w).attr('height', H).attr('rx', d => d.depth < 2 ? 12 : 6);
  g.select('text.lbl').attr('x', 12).attr('y', H / 2).attr('dy', '0.35em');
  g.select('tspan.glyph').text(d => glyphOf(d)).attr('font-size', 11).attr('dx', 0);
  g.select('tspan.txt').text(d => d.label).attr('dx', d => d.gw ? 6 : 0);
  g.select('g.tog').attr('display', d => d._children ? null : 'none').attr('transform', d => `translate(${d.w - 13},${H / 2})`);
  g.select('g.tog text').text(d => d.children ? '−' : countAll(d));
}

function keepAnchor(d, fn) {
  const t0 = d3.zoomTransform(svg.node()), sx = t0.applyX(d.px), sy = t0.applyY(d.py);
  fn(); render();
  const t1 = d3.zoomTransform(svg.node());
  zoom.translateBy(svg, (sx - t1.applyX(d.px)) / t1.k, (sy - t1.applyY(d.py)) / t1.k);
}
function toggle(d) { keepAnchor(d, () => { d.children = d.children ? null : d._children; }); }
function centerOn(d) {
  const r = stage.getBoundingClientRect(), t = d3.zoomTransform(svg.node());
  const target = d3.zoomIdentity.translate(r.width * 0.38 - d.px * t.k, r.height / 2 - d.py * t.k).scale(t.k);
  (reduce ? svg : svg.transition().duration(350)).call(zoom.transform, target);
}
function fit() {
  const vis = root.descendants(), r = stage.getBoundingClientRect(), pad = 24;
  const x0 = d3.min(vis, d => d.px), x1 = d3.max(vis, d => d.px + d.w), y0 = d3.min(vis, d => d.py) - H, y1 = d3.max(vis, d => d.py) + H;
  const k = Math.max(0.45, Math.min(1.1, (r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0)));
  const fitsY = (y1 - y0) * k <= r.height - pad * 2;
  const ty = fitsY ? (r.height - (y1 - y0) * k) / 2 - y0 * k : pad - y0 * k;
  svg.call(zoom.transform, d3.zoomIdentity.translate(pad - x0 * k, ty).scale(k));
}

// ---- tooltip
function showTip(ev, d) {
  const k = KIND[d.data.kind] ? KIND[d.data.kind][1] : '';
  tip.innerHTML = `<span class="k">${esc(d.depth === 1 ? 'Pipeline stage' : d.data.chapter ? 'Chapter · ' + fmt(d.data.t) : (d.data.kind || ''))}</span><b>${esc(d.data.en)}</b>${esc(d.data.sum)}`;
  tip.hidden = false; moveTip(ev);
}
function moveTip(ev) {
  const r = stage.getBoundingClientRect(); let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 16;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (x + tw > r.width - 8) x = Math.max(8, ev.clientX - r.left - tw - 14);
  if (y + th > r.height - 8) y = Math.max(8, ev.clientY - r.top - th - 12);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.hidden = true; }

// ---- panel
const panel = document.getElementById('panel');
function chapterOf(d) { for (let a = d; a; a = a.parent) if (a.data.chapter) return a; return null; }
function select(d, opt = {}) {
  sel = d;
  if (opt.expand && d._children && !d.children) { keepAnchor(d, () => { d.children = d._children; }); } else render();
  const ch = chapterOf(d), nb = d.data.nb || (ch && ch.data.nb);
  const crumbs = d.ancestors().reverse().slice(0, -1);
  const kids = d._children || [];
  const sib = d.parent ? d.parent._children : [d], i = sib.indexOf(d), prev = sib[i - 1], next = sib[i + 1];
  const kind = d.depth === 1 ? '管道环节' : d.data.chapter ? '视频章节' : (KIND[d.data.kind] || KIND.concept)[1];
  panel.style.setProperty('--c', `var(${d.data.c})`);
  panel.innerHTML = `
    <div class="crumbs">${crumbs.map(a => `<button type="button" data-id="${a.data.id}">${esc(a.data.zh)}</button><span>›</span>`).join('') || '<span>根节点</span>'}</div>
    <h2>${esc(d.data.zh)}<small>${esc(d.data.en)}</small></h2>
    <div class="chips"><span class="kind">${esc(kind)}</span>
      ${d.data.t != null ? `<a href="${VID}&t=${d.data.t}s" target="_blank" rel="noopener">▶ ${fmt(d.data.t)}</a>` : ''}
      ${nb ? `<a href="${REPO}${nb}" target="_blank" rel="noopener">${esc(nb)}</a>` : ''}</div>
    <p class="sum" lang="en">${esc(d.data.sum)}</p>
    ${d.data.note ? `<p class="note">${esc(d.data.note)}</p>` : ''}
    ${kids.length ? `<div class="kids"><h3>下一层 · ${kids.length}</h3>${kids.map(c => `<button type="button" data-id="${c.data.id}"><span>${c.data.kind === 'step' ? stepNo(c) + '. ' : ''}${esc(c.data.zh)}${c._children ? ` <span class="en">+${countAll(c)}</span>` : ''}</span><span class="en">${esc(c.data.en)}</span></button>`).join('')}</div>` : ''}
    <div class="pnav"><button type="button" ${prev ? `data-id="${prev.data.id}"` : 'disabled'}>← ${prev ? esc(prev.data.zh) : '同级第一个'}</button><button type="button" ${next ? `data-id="${next.data.id}"` : 'disabled'}>${next ? esc(next.data.zh) : '同级最后一个'} →</button></div>`;
  panel.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => { const n = byId.get(b.dataset.id); reveal(n); select(n); centerOn(n); }));
  document.querySelectorAll('.tl-seg').forEach(s => s.classList.toggle('on', ch && s.dataset.id === ch.data.id));
  document.getElementById('tlnow').textContent = ch ? `${fmt(ch.data.t)} · ${ch.data.en}` : '全部章节';
}

// ---- timeline
const bar = document.getElementById('tlbar');
DATA.chapters.forEach((c, i) => {
  const end = i + 1 < DATA.chapters.length ? DATA.chapters[i + 1].t : DATA.total, n = byId.get(c.id);
  const s = document.createElement('button');
  s.type = 'button'; s.className = 'tl-seg'; s.dataset.id = c.id; s.style.flex = String(end - c.t); s.style.setProperty('--c', `var(${n.data.c})`);
  s.title = `${fmt(c.t)} ${n.data.en}`; s.setAttribute('aria-label', s.title);
  s.addEventListener('click', () => { reveal(n); if (n._children) n.children = n._children; select(n); centerOn(n); });
  bar.appendChild(s);
});

// ---- legend, levels, search
document.getElementById('legend').innerHTML = Object.entries(KIND).filter(([k]) => k !== 'concept').map(([k, v]) => `<span><b>${k === 'step' ? '1' : v[0]}</b>${v[1]}</span>`).join('') + '<span>徽标数字 = 折叠的子孙节点数</span>';
document.getElementById('levels').addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (!b) return; setLevel(+b.dataset.l); if (sel) reveal(sel); render(); fit(); });
document.getElementById('fit').addEventListener('click', fit);
const q = document.getElementById('q'), qcount = document.getElementById('qcount');
let qt;
q.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(runSearch, 160); });
q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runSearch(true); } });
function runSearch(jump) {
  const s = q.value.trim().toLowerCase();
  hits = new Set();
  if (s.length >= 2) all.forEach(d => { const x = d.data; if ([x.zh, x.en, x.sum, x.note].some(v => v && v.toLowerCase().includes(s))) hits.add(d); });
  hits.forEach(reveal);
  qcount.textContent = s.length >= 2 ? `${hits.size} 个匹配` : '';
  render();
  if (jump && hits.size) { const first = [...hits][0]; select(first); centerOn(first); }
}

document.getElementById('foot').textContent = DATA.footer;

// ---- boot
setLevel(2);
const start = byId.get((location.hash || '').slice(1));
select(start || root);
fit();
if (start) { reveal(start); render(); centerOn(start); }
if (document.fonts) document.fonts.ready.then(() => { render(); if (!start) fit(); });
</script>
